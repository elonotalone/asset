<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一次点火</title>
<style>
  :root { --void:#0b1022; --ink:#e8ecf5; --go:#ffd45e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--void); color:var(--ink);
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  #wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:12px; }
  #stage { width:min(96vw, 880px); }
  canvas { width:100%; height:auto; display:block; border-radius:14px; background:var(--void);
    touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="board" width="880" height="616"></canvas></div></div>
<script>
(function () {
  "use strict";

  // 资产槽位表 —— 换皮只改这张表，玩法一行都不用动。
  // 每个键是一个槽，值是闭包内的相对路径；文件换掉，画面就换掉。
  // 目录名带件名前缀是闭包约定（`base/game.md` §资产目录）：货架是平铺的，
  // 裸 assets/ 会让下一件带贴图的游戏和这一件抢同一个目录。
  var ASSETS = {
    ship:      "./one-shot-route-02.assets/ship.png",
    station:   "./one-shot-route-02.assets/station.png",
    rockBig:   "./one-shot-route-02.assets/rock-big.png",
    rockSmall: "./one-shot-route-02.assets/rock-small.png",
    star:      "./one-shot-route-02.assets/star.png",
    dust:      "./one-shot-route-02.assets/star-tiny.png",
    burst:     "./one-shot-route-02.assets/burst.png",
    warn:      "./one-shot-route-02.assets/warn.png"
  };

  var COLS = 11, ROWS = 7, CELL = 72, PAD_X = 44, PAD_Y = 96;
  var W = 880, H = 616;

  // 三张固定盘面。**不随机**：随机会让"输了"变成运气问题，而这个玩法的全部尊严
  // 在于预算是自己算错的。
  //
  // 每张的 fuel 都比**最短合法线**多留几步（4 / 3 / 2，越往后越紧）。
  // 那条线由 build.mjs 的 shortestLegalRoute() 按真规则搜出来——四邻、不许自交、
  // 穿完补给、停在站上——盘面一改就重算，改瘦了当场不让出货。
  var BOARDS = [
    { fuel: 18, ship: [0, 3], goal: [10, 3],
      rocks: [[3,1],[3,2],[3,4],[3,5],[6,0],[6,1],[6,2],[6,5],[6,6],[8,3]],
      stars: [[3,3],[7,5]] },
    { fuel: 25, ship: [0, 6], goal: [10, 0],
      rocks: [[2,5],[2,4],[4,6],[4,5],[4,4],[6,3],[6,2],[6,1],[8,4],[8,3],[9,3]],
      stars: [[5,6],[9,5]] },
    { fuel: 26, ship: [5, 6], goal: [5, 0],
      rocks: [[4,4],[5,4],[6,4],[2,2],[3,2],[7,2],[8,2],[5,1],[0,3],[10,3]],
      stars: [[1,5],[9,5],[5,3]] }
  ];

  var canvas = document.getElementById("board");
  var g = canvas.getContext("2d");

  var img = {}, ready = {};
  Object.keys(ASSETS).forEach(function (slot) {
    var el = new Image();
    el.onload = function () { ready[slot] = true; draw(); };
    el.onerror = function () { ready[slot] = false; draw(); };
    el.src = ASSETS[slot];
    img[slot] = el;
  });

  // 背景尘点：固定位置，不用随机数，每次装载长一个样。
  var DUST = [];
  (function () {
    var seed = 20260816;
    for (var i = 0; i < 46; i++) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      var x = (seed % W), y = ((seed >> 7) % H), s = 6 + ((seed >> 13) % 10);
      DUST.push([x, y, s]);
    }
  })();

  var state = null, boardIndex = 0, tick = 0;

  function makeState(index) {
    var b = BOARDS[index % BOARDS.length];
    return {
      board: b,
      route: [b.ship.slice()],
      phase: "plot",           // plot → fly → win / lose
      flyAt: 0, flyT: 0,
      taken: {},               // 已收到的星
      crash: null,
      why: ""
    };
  }

  function key(c, r) { return c + "," + r; }
  function isRock(b, c, r) {
    for (var i = 0; i < b.rocks.length; i++) if (b.rocks[i][0] === c && b.rocks[i][1] === r) return true;
    return false;
  }
  function rockKind(c, r) { return (c * 7 + r * 3) % 2 === 0 ? "rockBig" : "rockSmall"; }
  function inRoute(s, c, r) {
    for (var i = 0; i < s.route.length; i++) if (s.route[i][0] === c && s.route[i][1] === r) return i;
    return -1;
  }
  function cellX(c) { return PAD_X + c * CELL; }
  function cellY(r) { return PAD_Y + r * CELL; }

  function tryExtend(c, r) {
    if (state.phase !== "plot") return;
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
    var last = state.route[state.route.length - 1];
    var prev = state.route[state.route.length - 2];
    if (prev && prev[0] === c && prev[1] === r) { state.route.pop(); draw(); return; }  // 原路撤回
    if (Math.abs(last[0] - c) + Math.abs(last[1] - r) !== 1) return;                    // 只走四邻
    if (inRoute(state, c, r) >= 0) return;                                              // 不许自交
    if (state.route.length - 1 >= state.board.fuel) return;                             // 预算到顶
    state.route.push([c, r]);
    draw();
  }

  function launch() {
    if (state.phase !== "plot") return;
    if (state.route.length < 2) { state.why = "还没画路线"; draw(); return; }
    state.phase = "fly"; state.flyAt = 0; state.flyT = 0; state.why = "";
  }

  function restart(next) {
    boardIndex = next ? boardIndex + 1 : boardIndex;
    state = makeState(boardIndex);
    draw();
  }

  canvas.addEventListener("pointerdown", function (e) {
    var box = canvas.getBoundingClientRect();
    var x = (e.clientX - box.left) * (W / box.width);
    var y = (e.clientY - box.top) * (H / box.height);
    if (state.phase === "win" || state.phase === "lose") { restart(state.phase === "win"); return; }
    if (y < PAD_Y - 26) { launch(); return; }
    tryExtend(Math.floor((x - PAD_X) / CELL), Math.floor((y - PAD_Y) / CELL));
  });

  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "r" || k === "R") { restart(false); return; }
    if (state.phase === "win" || state.phase === "lose") {
      if (k === " " || k === "Enter") { restart(state.phase === "win"); e.preventDefault(); }
      return;
    }
    if (k === " " || k === "Enter") { launch(); e.preventDefault(); return; }
    var last = state.route[state.route.length - 1];
    if (k === "ArrowLeft")  { tryExtend(last[0] - 1, last[1]); e.preventDefault(); }
    if (k === "ArrowRight") { tryExtend(last[0] + 1, last[1]); e.preventDefault(); }
    if (k === "ArrowUp")    { tryExtend(last[0], last[1] - 1); e.preventDefault(); }
    if (k === "ArrowDown")  { tryExtend(last[0], last[1] + 1); e.preventDefault(); }
    if (k === "Backspace" && state.route.length > 1) { state.route.pop(); draw(); e.preventDefault(); }
  });

  function stamp(slot, x, y, size, rot) {
    var el = img[slot];
    if (ready[slot] && el.naturalWidth) {
      g.save();
      g.translate(x, y);
      if (rot) g.rotate(rot);
      g.drawImage(el, -size / 2, -size / 2, size, size);
      g.restore();
      return true;
    }
    return false;
  }

  function fallbackDot(x, y, size, color) {
    g.fillStyle = color;
    g.beginPath(); g.arc(x, y, size / 2, 0, Math.PI * 2); g.fill();
  }

  function draw() {
    var s = state, b = s.board;
    g.fillStyle = "#0b1022"; g.fillRect(0, 0, W, H);

    g.globalAlpha = 0.55;
    for (var i = 0; i < DUST.length; i++) {
      if (!stamp("dust", DUST[i][0], DUST[i][1], DUST[i][2])) {
        fallbackDot(DUST[i][0], DUST[i][1], 2, "#33406b");
      }
    }
    g.globalAlpha = 1;

    // 盘面格线
    g.strokeStyle = "rgba(120,146,214,0.16)"; g.lineWidth = 1;
    for (var c = 0; c <= COLS; c++) {
      g.beginPath(); g.moveTo(cellX(c), cellY(0)); g.lineTo(cellX(c), cellY(ROWS)); g.stroke();
    }
    for (var r = 0; r <= ROWS; r++) {
      g.beginPath(); g.moveTo(cellX(0), cellY(r)); g.lineTo(cellX(COLS), cellY(r)); g.stroke();
    }

    // 已画的线
    if (s.route.length > 1) {
      g.strokeStyle = s.phase === "fly" ? "#ffd45e" : "#7fd3ff";
      g.lineWidth = 6; g.lineCap = "round"; g.lineJoin = "round";
      g.beginPath();
      g.moveTo(cellX(s.route[0][0]) + CELL / 2, cellY(s.route[0][1]) + CELL / 2);
      for (var i2 = 1; i2 < s.route.length; i2++) {
        g.lineTo(cellX(s.route[i2][0]) + CELL / 2, cellY(s.route[i2][1]) + CELL / 2);
      }
      g.stroke();
    }

    // 陨石
    for (var i3 = 0; i3 < b.rocks.length; i3++) {
      var rc = b.rocks[i3];
      var cx = cellX(rc[0]) + CELL / 2, cy = cellY(rc[1]) + CELL / 2;
      if (!stamp(rockKind(rc[0], rc[1]), cx, cy, CELL - 8)) fallbackDot(cx, cy, CELL - 20, "#5b6584");
    }

    // 星标（没收到的才画）
    for (var i4 = 0; i4 < b.stars.length; i4++) {
      var st = b.stars[i4];
      if (s.taken[key(st[0], st[1])]) continue;
      var sx = cellX(st[0]) + CELL / 2, sy = cellY(st[1]) + CELL / 2;
      var pulse = 1 + 0.06 * Math.sin(tick / 12 + i4);
      if (!stamp("star", sx, sy, (CELL - 26) * pulse)) fallbackDot(sx, sy, 16, "#ffd45e");
    }

    // 终点站
    var gx = cellX(b.goal[0]) + CELL / 2, gy = cellY(b.goal[1]) + CELL / 2;
    if (!stamp("station", gx, gy, CELL - 4)) fallbackDot(gx, gy, CELL - 16, "#7fd3ff");

    // 飞船
    var pos = shipPos();
    if (!stamp("ship", pos.x, pos.y, CELL - 14, pos.rot)) fallbackDot(pos.x, pos.y, CELL - 26, "#e8ecf5");

    if (s.crash) {
      var bx = cellX(s.crash[0]) + CELL / 2, by = cellY(s.crash[1]) + CELL / 2;
      if (!stamp("burst", bx, by, CELL + 18)) fallbackDot(bx, by, CELL, "#ff6b6b");
    }

    drawHud();
  }

  function shipPos() {
    var s = state;
    var a = s.route[Math.min(s.flyAt, s.route.length - 1)];
    var bcell = s.route[Math.min(s.flyAt + 1, s.route.length - 1)];
    var t = s.phase === "fly" ? s.flyT : 0;
    var x = cellX(a[0] + (bcell[0] - a[0]) * t) + CELL / 2;
    var y = cellY(a[1] + (bcell[1] - a[1]) * t) + CELL / 2;
    var dx = bcell[0] - a[0], dy = bcell[1] - a[1];
    var rot = 0;
    if (dx === 1) rot = Math.PI / 2; else if (dx === -1) rot = -Math.PI / 2; else if (dy === 1) rot = Math.PI;
    return { x: x, y: y, rot: rot };
  }

  function drawHud() {
    var s = state, b = s.board;
    var used = s.route.length - 1, left = b.fuel - used;
    var got = 0;
    for (var i = 0; i < b.stars.length; i++) if (s.taken[key(b.stars[i][0], b.stars[i][1])]) got++;

    g.fillStyle = "#e8ecf5";
    g.font = "600 26px ui-sans-serif, system-ui, sans-serif";
    g.textBaseline = "middle";
    g.fillText("燃料 " + left + " / " + b.fuel, PAD_X, 40);
    g.fillText("补给 " + got + " / " + b.stars.length, PAD_X + 250, 40);

    var hint = s.phase === "plot"
      ? "点格子或按方向键连出整条线 · 空格点火"
      : s.phase === "fly" ? "点火后不接受输入" : "点一下或按空格继续";
    g.fillStyle = "#8ea0cc";
    g.font = "400 20px ui-sans-serif, system-ui, sans-serif";
    g.textAlign = "right";
    g.fillText(hint, W - PAD_X, 40);
    g.textAlign = "left";

    if (s.why) {
      if (!stamp("warn", W / 2 - 150, 40, 30)) fallbackDot(W / 2 - 150, 40, 20, "#ff6b6b");
      g.fillStyle = "#ff6b6b";
      g.font = "600 22px ui-sans-serif, system-ui, sans-serif";
      g.fillText(s.why, W / 2 - 128, 40);
    }

    if (s.phase === "win" || s.phase === "lose") {
      g.fillStyle = "rgba(11,16,34,0.82)";
      g.fillRect(0, H / 2 - 78, W, 156);
      g.fillStyle = s.phase === "win" ? "#ffd45e" : "#ff6b6b";
      g.font = "700 46px ui-sans-serif, system-ui, sans-serif";
      g.textAlign = "center";
      g.fillText(s.phase === "win" ? "进站" : "没到站", W / 2, H / 2 - 16);
      g.fillStyle = "#c8d2ee";
      g.font = "400 22px ui-sans-serif, system-ui, sans-serif";
      g.fillText(s.phase === "win" ? "下一张盘面：点一下或按空格" : (s.why || "按 R 重画这一张"), W / 2, H / 2 + 34);
      g.textAlign = "left";
    }
  }

  function step() {
    tick++;
    var s = state;
    if (s.phase === "fly") {
      s.flyT += 0.12;
      if (s.flyT >= 1) {
        s.flyT = 0; s.flyAt++;
        var at = s.route[Math.min(s.flyAt, s.route.length - 1)];
        if (isRock(s.board, at[0], at[1])) {
          s.crash = at; s.phase = "lose"; s.why = "撞上了，按 R 重画这一张";
        } else {
          if (inStars(s.board, at)) s.taken[key(at[0], at[1])] = true;
          if (s.flyAt >= s.route.length - 1) {
            var atGoal = at[0] === s.board.goal[0] && at[1] === s.board.goal[1];
            var allStars = Object.keys(s.taken).length === s.board.stars.length;
            if (atGoal && allStars) { s.phase = "win"; s.why = ""; }
            else { s.phase = "lose"; s.why = atGoal ? "补给没收齐" : "线到头了，人还在半路"; }
          }
        }
      }
    }
    draw();
    requestAnimationFrame(step);
  }

  function inStars(b, cell) {
    for (var i = 0; i < b.stars.length; i++) if (b.stars[i][0] === cell[0] && b.stars[i][1] === cell[1]) return true;
    return false;
  }

  state = makeState(0);
  draw();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
