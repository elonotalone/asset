<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="一款纯文字的选择小游戏：一夜值班的七次取舍决定六种结局之一，全程没有限时、没有随机、一张图都没有。">
<title>潮位站的一夜</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #FBF7F0; overflow: hidden; }
body { touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { display: block; width: 100%; height: 100%; }
#fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #fff; opacity: .75; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="一款纯文字的选择小游戏：一夜值班的七次取舍决定六种结局之一，全程没有限时、没有随机、一张图都没有。"></canvas>
<noscript><div id="fallback">这是一款需要 JavaScript 才能运行的小游戏：一款纯文字的选择小游戏：一夜值班的七次取舍决定六种结局之一，全程没有限时、没有随机、一张图都没有。</div></noscript>
<script>
// 潮位站的一夜 —— 玩法风格「静默后果」（quiet-consequence）
// 循环：读一小段处境 → 在几个都说得通的做法里挑一个 → 立刻看到眼前发生了什么，
//      但看不到它改了哪个数 → 处境因此不同，回到读处境。
// 难度只来自取舍：每个选项都至少让一样东西变好、一样东西变差。
// 没有限时、没有随机、没有一张图；结局由累计的账决定，天亮时才摊开。
var bundle = (function () {
  "use strict";

  // 纸 + 墨 + 一支只用在「可以点的东西」上的棕金 + 一支只在结局屏分「成了 / 没成」的松绿
  var PAPER = [251, 247, 240], INK = [42, 38, 34], TAP = [122, 92, 62], DONE = [47, 107, 79];
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  var REVEAL_MS = 14;      // 正文一个字一个字接上来，每字多少毫秒（读完才给选项）
  var START = { e: 0, t: 0, s: 4 };

  // 每一幕：处境指示 + 正文 + 选项。选项的 d 是它悄悄改动的账，屏上永远不显示。
  var SCENES = {
    s1: {
      at: "二十三时四十分 · 雨",
      text: "雨从傍晚开始下，值班室的窗玻璃像挂了一层水。潮位仪的针在纸带上画出一条不太规矩的线。交接的老周临走时说：今晚没什么事，别折腾。",
      opts: [
        { text: "把今晚的潮位记录从头翻一遍", d: { e: 2, s: -1 }, to: "s2" },
        { text: "披上雨衣，去码头看一眼水线", d: { e: 1, t: 1, s: -2 }, to: "s3" },
        { text: "按惯例填完表，早点靠一会", d: { e: -1, s: 1 }, to: "s4" }
      ]
    },
    s2: {
      at: "零时二十分 · 记录本",
      text: "三个小时的读数摊在桌上。涨得不算快，可每一格都比预报多出一点。多出来的这一点，你说不清是仪器的脾气，还是海的脾气。",
      opts: [
        { text: "打电话把站长叫起来一起核对", d: { e: 1, t: -1 }, to: "s5" },
        { text: "自己再核一遍，别半夜吵人", d: { e: 1, s: -1 }, to: "s5" }
      ]
    },
    s3: {
      at: "零时三十分 · 码头",
      text: "水线比白天高出一个台阶。浪打在挡墙上，回头的水沫能溅到路面。老陈家的船亮着灯，两个人正往船上搬冰箱——他们打算凌晨出海。",
      opts: [
        { text: "先劝老陈今晚别出港", d: { t: 1, s: -1 }, to: "s5" },
        { text: "先把水线高度量准了再说", d: { e: 2, s: -1 }, to: "s5" }
      ]
    },
    s4: {
      at: "零时十分 · 表格",
      text: "表按老样子填完了，字迹工整，一栏没漏。窗外的雨声比一小时前重了一档。",
      opts: [
        { text: "表填完了，还是去看一眼", d: { s: -1 }, to: "s3" },
        { text: "靠在椅子上眯一会儿", d: { e: -1, s: 2 }, to: "s5" }
      ]
    },
    s5: {
      at: "两时整 · 电话",
      text: "电话响了，是老陈：站里怎么说？我们这趟货压了三天了。你手上有的，只是一条比预报涨得多一点的线。",
      opts: [
        { text: "让他们等到天亮再说", d: { t: -1 }, to: "s6" },
        { text: "说不清就说没事，别耽误人家", d: { e: -1, t: 1 }, to: "s6" },
        { text: "把手上的读数一条一条念给他听", d: { e: 1, t: 1 }, to: "s6" }
      ]
    },
    s6: {
      at: "三时整 · 值班室",
      text: "雨没有要停的意思。离天亮还有三个小时：你可以再冒一趟雨，可以守着仪表看趋势，也可以趴一会儿。",
      opts: [
        { text: "再去测一次，这回带上尺子", d: { e: 2, s: -2 }, to: "s7" },
        { text: "守着仪表，每十分钟记一格", d: { e: 1, s: -1 }, to: "s7" },
        { text: "趴一会儿，四点再说", d: { s: 2 }, to: "s7" }
      ]
    },
    s7: {
      at: "四时十分 · 站长回电",
      text: "站长的声音里全是睡意：说吧，什么事非得这个点打过来。",
      opts: [
        { text: "报数，请求天亮前封航", d: {}, to: "end", tag: "ask" },
        { text: "只把情况说一遍，不提要求", d: {}, to: "end", tag: "tell" },
        { text: "说没什么事，只是例行报告", d: { e: -1 }, to: "end", tag: "hush" }
      ]
    }
  };

  var ENDINGS = {
    signed: { win: true, title: "封航令在天亮前签下", text: "站长听完你念的那串数，沉默了两秒，说：把纸带拍给我。六点零五分，封航通告贴在了码头口。老陈骂了两句，把冰箱又搬了下来。八点整，浪头翻过挡墙，路面积水到脚踝。" },
    doubted: { win: false, title: "他信不过你", text: "你把数报得很清楚，可对面停了很久：这事你有把握？上回也是你说要封的。天亮时通告没有发。海面那天没出事——你到现在也不知道，那是因为你判断错了，还是因为运气。" },
    thin: { win: false, title: "你张了嘴，但拿不出数", text: "你说出口才发现，能拿出来的只有一句「涨得比预报多一点」。站长说，等白班的人来看看再说。天亮了，风向变了，什么也没发生。你收拾东西下班，路过码头时没敢看老陈。" },
    without: { win: false, title: "站长自己下了令，你的名字不在上面", text: "你只说了情况。他挂了电话，自己去调了另一头的数据，六点半发了封航通告。事情办成了，只是没有一个字是你争来的。你在交接本上写：夜间无异常。" },
    silent: { win: false, title: "天亮了。你什么也没说过", text: "例行报告，一切正常。你把纸带卷好收进柜子。老陈的船六点出的港，中午安全回来了。你松了口气，然后开始想：如果那天没回来呢——这个念头你后来想了很多年。" },
    asleep: { win: false, title: "你在值班室睡着了", text: "趴下去的时候只想着眯十分钟。醒来是五点四十，纸带上多了一段谁也没看着的曲线。你把那一段撕下来夹进本子，谁也没告诉。" }
  };

  var W = 0, H = 0, S = null;

  function finite(v, f) { return (typeof v === "number" && isFinite(v)) ? v : f; }

  function fresh() {
    S = {
      scene: "s1", e: START.e, t: START.t, s: START.s,
      // 开局这一页本来就已经印在纸上了：加载完就在读，没有开场页、没有空屏。
      reveal: SCENES.s1.text.length, act: 1, log: [], trail: ["s1"],
      over: null, ending: null, overAge: 0, acts: 0,
      rows: [], rowH: 0
    };
    return S;
  }

  function serif(g, px, weight) {
    g.font = (weight ? weight + " " : "") + Math.round(px) +
      "px 'Noto Sans CJK SC', Georgia, 'Songti SC', serif";
  }

  function layout() {
    var pad = Math.max(20, Math.min(W, H) * 0.062);
    var col = Math.min(W - pad * 2, Math.max(360, W * 0.62));
    return {
      pad: pad, col: col, x: Math.round((W - col) / 2),
      body: Math.min(W, H) * 0.038,
      opt: Math.min(W, H) * 0.035,
      small: Math.min(W, H) * 0.024,
      lead: Math.min(W, H) * 0.062
    };
  }

  function wrap(g, text, width) {
    var lines = [], cur = "", i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text.charAt(i);
      if (g.measureText(cur + ch).width > width && cur) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function scene() { return SCENES[S.scene]; }
  function ready() { return S.over ? true : S.reveal >= scene().text.length; }

  /**
   * 整页的落点：处境一行、正文若干行、选项一行一个、末尾一行提示，
   * **整块在纸上垂直居中**（一页排得好看的字，这是这个风格唯一的版面主张）。
   * 几何一律按**整段正文**算，不按已经露出来的那几个字算 —— 否则字一边接上来页面一边跳。
   */
  function optRows(g) {
    var L = layout(), sc = scene(), i;
    serif(g, L.body);
    var lines = wrap(g, sc.text, L.col);
    var blockH = L.lead * 1.0                     // 处境
      + L.lead * lines.length                     // 正文
      + L.lead * 0.9                              // 正文与选项之间的留白
      + L.lead * 1.15 * sc.opts.length            // 选项
      + L.lead * 1.0;                             // 提示
    var top = Math.max(L.pad, (H - blockH) / 2);
    var bodyTop = top + L.lead * 1.9;
    var optTop = bodyTop + L.lead * (lines.length - 1) + L.lead * 1.9;
    var rows = [];
    for (i = 0; i < sc.opts.length; i++) rows.push({ y: optTop + i * L.lead * 1.15, h: L.lead });
    return { rows: rows, lines: lines, atY: top + L.lead * 0.8, bodyTop: bodyTop, L: L };
  }

  /** 结局屏的落点：标题 + 收尾一段 + 「这一夜你做过的事」逐条，同样整块居中。 */
  function endRows(g) {
    var L = layout(), end = ENDINGS[S.ending];
    serif(g, L.body);
    var lines = wrap(g, end.text, L.col);
    var blockH = L.lead * 1.0 + L.lead * 1.5 + L.lead * lines.length
      + L.lead * 1.4 + L.lead * 0.78 * (S.log.length + 2);
    var top = Math.max(L.pad, (H - blockH) / 2);
    return {
      L: L, end: end, lines: lines,
      dawnY: top + L.lead * 0.7,
      titleY: top + L.lead * 1.9,
      textTop: top + L.lead * 3.1,
      logTop: top + L.lead * (3.1 + lines.length + 0.9)
    };
  }

  function endingFor(tag) {
    if (tag === "ask") {
      if (S.e >= 5 && S.t >= 1) return "signed";
      if (S.e >= 5) return "doubted";
      return "thin";
    }
    if (tag === "tell") return S.e >= 5 ? "without" : "thin";
    return "silent";
  }

  function choose(k) {
    if (S.over || !ready()) return;
    var sc = scene(), o = sc.opts[k];
    if (!o) return;
    S.acts++;
    var d = o.d || {};
    S.e += finite(d.e, 0);
    S.t += finite(d.t, 0);
    S.s += finite(d.s, 0);
    S.log.push({ act: S.act, at: sc.at, text: o.text, d: { e: finite(d.e, 0), t: finite(d.t, 0), s: finite(d.s, 0) } });
    S.act++;
    if (S.s <= 0) { S.over = "lose"; S.ending = "asleep"; S.overAge = 0; return; }
    if (o.to === "end") {
      S.ending = endingFor(o.tag);
      S.over = ENDINGS[S.ending].win ? "win" : "lose";
      S.overAge = 0;
      return;
    }
    S.scene = o.to;
    S.trail.push(o.to);
    S.reveal = 0;
  }

  return {
    title: "潮位站的一夜",

    setup: function (env) {
      W = finite(env && env.width, 900);
      H = finite(env && env.height, 620);
      fresh();
    },

    resize: function (w, h) { W = finite(w, W); H = finite(h, H); },

    pointer: function (x, y, phase) {
      if (phase !== "down") return;
      y = finite(y, -1);
      if (S.over) { if (S.overAge > 420) fresh(); return; }
      if (!ready()) { S.reveal = scene().text.length; return; }   // 点一下把这段话补齐，不是跳过
      // 落点用**上一帧真画出来的那几行**，不另算一份：另算的那份与画出来的差半行，
      // 用户就会点中隔壁的选项。
      for (var i = 0; i < S.rows.length; i++) {
        if (y >= S.rows[i] - S.rowH * 0.7 && y <= S.rows[i] + S.rowH * 0.35) {
          choose(i);
          return;
        }
      }
    },

    key: function (code, phase) {
      if (phase !== "down") return;
      if (S.over) {
        if (code === "Space" || code === "Enter" || code === " ") fresh();
        return;
      }
      if (!ready()) { S.reveal = scene().text.length; return; }
      if (code === "Digit1" || code === "1") choose(0);
      else if (code === "Digit2" || code === "2") choose(1);
      else if (code === "Digit3" || code === "3") choose(2);
    },

    // 正文一个字一个字接上来；读完就定住。除此之外没有任何东西在动。
    update: function (dt) {
      dt = finite(dt, 16.67);
      if (S.over) { S.overAge += dt; return; }
      var n = scene().text.length;
      if (S.reveal < n) S.reveal = Math.min(n, S.reveal + dt / REVEAL_MS);
    },

    draw: function (g) {
      var L = layout(), i;
      g.fillStyle = rgba(PAPER, 1);
      g.fillRect(0, 0, W, H);

      g.textBaseline = "alphabetic";
      g.textAlign = "left";

      if (S.over) {
        var e = endRows(g);
        serif(g, L.small);
        g.fillStyle = rgba(INK, 1);
        g.globalAlpha = 0.5;
        g.fillText("天亮了", L.x, e.dawnY);
        g.globalAlpha = 1;

        serif(g, Math.min(W, H) * 0.05, "700");
        g.fillStyle = rgba(e.end.win ? DONE : INK, 1);
        g.fillText(e.end.title, L.x, e.titleY);

        serif(g, L.body);
        g.fillStyle = rgba(INK, 1);
        g.globalAlpha = 0.9;
        for (i = 0; i < e.lines.length; i++) g.fillText(e.lines[i], L.x, e.textTop + L.lead * i);
        g.globalAlpha = 1;
        return;
      }

      var sc = scene();
      var page = optRows(g);
      serif(g, L.small);
      g.fillStyle = rgba(INK, 1);
      g.globalAlpha = 0.45;
      g.fillText(sc.at, L.x, page.atY);
      g.globalAlpha = 1;

      // 已经露出来的字：按整段的折行切，逐行给出去，页面不跳
      serif(g, L.body);
      var left = Math.floor(S.reveal);
      g.fillStyle = rgba(INK, 1);
      g.globalAlpha = 0.92;
      for (i = 0; i < page.lines.length && left > 0; i++) {
        var ln = page.lines[i];
        g.fillText(left >= ln.length ? ln : ln.slice(0, left), L.x, page.bodyTop + L.lead * i);
        left -= ln.length;
      }
      g.globalAlpha = 1;
    },

    hud: function (g) {
      var L = layout(), i;

      if (S.over) {
        // 摊开账：这一局你走到这里，是因为前面这几步
        var top = endRows(g).logTop;
        serif(g, L.small, "700");
        g.fillStyle = rgba(INK, 1);
        g.globalAlpha = 0.75;
        g.fillText("这一夜你做过的事", L.x, top);
        g.globalAlpha = 1;
        serif(g, L.small);
        for (i = 0; i < S.log.length; i++) {
          var r = S.log[i];
          var say = "";
          if (r.d.e) say += (r.d.e > 0 ? "把握 +" : "把握 ") + r.d.e + "　";
          if (r.d.t) say += (r.d.t > 0 ? "人情 +" : "人情 ") + r.d.t + "　";
          if (r.d.s) say += (r.d.s > 0 ? "精神 +" : "精神 ") + r.d.s;
          if (!say) say = "（这一步什么也没改变）";
          g.globalAlpha = 0.8;
          g.fillStyle = rgba(INK, 1);
          g.fillText(r.text, L.x, top + L.lead * 0.78 * (i + 1));
          g.globalAlpha = 0.55;
          g.fillStyle = rgba(TAP, 1);
          g.textAlign = "right";
          g.fillText(say, L.x + L.col, top + L.lead * 0.78 * (i + 1));
          g.textAlign = "left";
          g.globalAlpha = 1;
        }
        serif(g, L.small);
        g.fillStyle = rgba(TAP, 1);
        g.globalAlpha = 0.8;
        g.fillText("按一下从头再来一夜", L.x, top + L.lead * 0.78 * (S.log.length + 1.6));
        g.globalAlpha = 1;
        return;
      }

      if (!ready()) { S.rows = []; return; }      // 读完这一段才给选项

      var probe = optRows(g);
      S.rows = [];
      S.rowH = L.lead;
      for (i = 0; i < probe.rows.length; i++) S.rows.push(probe.rows[i].y);
      serif(g, L.opt);
      for (i = 0; i < probe.rows.length; i++) {
        g.fillStyle = rgba(TAP, 1);
        g.globalAlpha = 0.92;
        g.fillText((i + 1) + "　" + scene().opts[i].text, L.x, probe.rows[i].y);
        g.globalAlpha = 0.35;
        g.strokeStyle = rgba(TAP, 1);
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(L.x, probe.rows[i].y + L.lead * 0.22);
        g.lineTo(L.x + L.col, probe.rows[i].y + L.lead * 0.22);
        g.stroke();
        g.globalAlpha = 1;
      }
      serif(g, L.small);
      g.fillStyle = rgba(INK, 1);
      g.globalAlpha = 0.4;
      g.fillText("点一行，或按 1 / 2 / 3。想多久都行。",
        L.x, probe.rows[probe.rows.length - 1].y + L.lead * 1.3);
      g.globalAlpha = 1;
    },

    __probe: function () {
      return {
        over: S.over, scene: S.scene, act: S.act, acts: S.acts,
        ready: ready(), options: S.over ? 0 : scene().opts.length,
        ending: S.ending,                         // 只有到了结局才有值
        steps: S.log.length,
        trail: S.trail.join(">"),                 // 这一局翻过的那几页（玩家自己看见的）
        geom: { x: layout().x, col: layout().col, optY: S.rows.slice(), lead: layout().lead }
      };
    }
  };
})();


(function () {
  "use strict";
  var cv = document.getElementById("stage");
  var g = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, started = false;

  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (started && bundle.resize) bundle.resize(W, H);
  }

  fit();
  bundle.setup({ ctx: g, canvas: cv, width: W, height: H });
  started = true;
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  function at(e) {
    var r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function on(name, phase) {
    cv.addEventListener(name, function (e) {
      var p = at(e);
      bundle.pointer(p[0], p[1], phase);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  }
  on("pointerdown", "down");
  on("pointermove", "move");
  on("pointerup", "up");
  cv.addEventListener("pointercancel", function () { bundle.pointer(-1, -1, "up"); });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    bundle.key(e.code || e.key, "down");
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { bundle.key(e.code || e.key, "up"); });

  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(ts - last, 50) : 16.67;
    last = ts;
    bundle.update(dt, ts);
    bundle.draw(g, ts);
    bundle.hud(g, ts);
    window.requestAnimationFrame(loop);
  }
  window.requestAnimationFrame(loop);
})();

</script>
</body>
</html>
