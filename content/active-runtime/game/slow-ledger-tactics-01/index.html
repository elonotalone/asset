<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="一款没有计时器的调水解谜：注水会引发连锁漫堤，排海是代价，八次闸次之内把全盘水位降到二以内。">
<title>堤坝调水</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #F2EBDD; overflow: hidden; }
body { touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { display: block; width: 100%; height: 100%; }
#fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #fff; opacity: .75; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="一款没有计时器的调水解谜：注水会引发连锁漫堤，排海是代价，八次闸次之内把全盘水位降到二以内。"></canvas>
<noscript><div id="fallback">这是一款需要 JavaScript 才能运行的小游戏：一款没有计时器的调水解谜：注水会引发连锁漫堤，排海是代价，八次闸次之内把全盘水位降到二以内。</div></noscript>
<script>
// 堤坝调水 —— 玩法风格「慢账」（slow-ledger-tactics）
// 循环：读一遍全公开的水位盘 → 在 16 个落点里权衡代价 → 注水后按写死的规则连锁漫堤 →
//      闸次少一次、排海账多一笔，回到读盘面。
// 难度只来自计算：没有计时器、没有暗格、没有随机数。盘面固定，玩家不动它就不动。
var bundle = (function () {
  "use strict";

  var K = {
    n: 4,                 // 盘面边长
    gates: 8,             // 闸次预算（这一局能注几次水）
    quota: 30,            // 排海配额：漫出堤外的水记在这里，超了就是决堤
    safe: 2,              // 安全线：全盘水位 ≤2 即调水完成
    brim: 4,              // 漫堤线：水位到 4 就把四份水平分给四邻
    waveMs: 190,          // 连锁一波显现的间隔——宁可慢，也要让人看清因果
    settleMs: 120         // 最后一波结束后的停顿，收势用
  };

  // 初始盘面写死一张（solve.mjs 选盘时验过：8 闸次内可解，最省的一条线排海 24 份）。
  // 每局都是同一张，因为这个风格里「运气好」是设计事故。
  var BOARD = [2, 3, 3, 2,
               3, 3, 3, 3,
               3, 3, 3, 3,
               2, 3, 3, 2];

  // 纸与墨：一个暖浅底、一个近黑的墨、一个只表代价的红、一个表「已确定」的中性灰。
  var PAPER = [242, 235, 221], INK = [27, 26, 23], COST = [178, 58, 47], CALM = [158, 151, 136];
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  var W = 0, H = 0, S = null;

  function finite(v, f) { return (typeof v === "number" && isFinite(v)) ? v : f; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function fresh() {
    return {
      cells: BOARD.slice(),
      phase: "brief",     // brief → play → over
      gatesUsed: 0,
      spill: 0,
      over: null,
      history: [],        // 撤销栈：这个风格里唯一允许的容错
      last: null,         // 上一步的账：落点 / 波数 / 排海份数
      chain: null,        // 正在显现的连锁：{ waves:[…], at, timer, hot }
      pourAt: -1
    };
  }

  function snapshot() {
    return {
      cells: S.cells.slice(), gatesUsed: S.gatesUsed, spill: S.spill,
      last: S.last, pourAt: S.pourAt
    };
  }

  function threes(cells) {
    var n = 0;
    for (var i = 0; i < cells.length; i++) if (cells[i] > K.safe) n += 1;
    return n;
  }

  /** 漫堤推演。返回逐波的账：每波哪些格子漫出、这一波排海几份。规则写死，无随机。 */
  function settle(cells) {
    var g = cells.slice(), waves = [], spill = 0, guard = 0;
    for (;;) {
      var hot = [];
      for (var i = 0; i < g.length; i++) if (g[i] >= K.brim) hot.push(i);
      if (!hot.length) return { cells: g, waves: waves, spill: spill };
      var out = 0;
      for (var h = 0; h < hot.length; h++) {
        var idx = hot[h], r = Math.floor(idx / K.n), c = idx % K.n;
        g[idx] -= K.brim;
        var d = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (var k = 0; k < 4; k++) {
          var nr = r + d[k][0], nc = c + d[k][1];
          if (nr < 0 || nr >= K.n || nc < 0 || nc >= K.n) out += 1;
          else g[nr * K.n + nc] += 1;
        }
      }
      spill += out;
      waves.push({ hot: hot, cells: g.slice(), out: out });
      guard += 1;
      if (guard > 200) return { cells: g, waves: waves, spill: spill };
    }
  }

  function judge() {
    if (S.spill > K.quota) { S.over = "lose"; S.phase = "over"; return; }
    if (threes(S.cells) === 0) { S.over = "win"; S.phase = "over"; return; }
    if (S.gatesUsed >= K.gates) { S.over = "lose"; S.phase = "over"; }
  }

  function pour(idx) {
    if (S.phase !== "play" || S.chain) return;
    if (idx < 0 || idx >= K.n * K.n) return;
    S.history.push(snapshot());
    if (S.history.length > 64) S.history.shift();
    var next = S.cells.slice();
    next[idx] += 1;
    var res = settle(next);
    S.gatesUsed += 1;
    S.pourAt = idx;
    S.last = { at: idx, waves: res.waves.length, out: res.spill };
    if (!res.waves.length) {
      S.cells = res.cells;
      judge();
      return;
    }
    // 连锁不是一瞬间结算完的：一波一波显出来，玩家要看清水是从哪儿流到哪儿的。
    S.chain = { waves: res.waves, at: -1, timer: 0, final: res.cells, spill: res.spill };
  }

  function undo() {
    if (S.chain || !S.history.length) return;
    if (S.phase === "over") S.phase = "play";
    var p = S.history.pop();
    S.cells = p.cells; S.gatesUsed = p.gatesUsed; S.spill = p.spill;
    S.last = p.last; S.pourAt = p.pourAt; S.over = null;
  }

  // ── 版面：左栏盘面，右栏账目。两栏都常驻，信息永远同屏 ────────────────
  function layout() {
    var pad = Math.round(Math.min(W, H) * 0.045);
    var leftW = Math.round((W - pad * 3) * 0.58);
    var boardEdge = Math.min(leftW, H - pad * 2);
    var bx = pad + Math.round((leftW - boardEdge) / 2);
    var by = pad + Math.round((H - pad * 2 - boardEdge) / 2);
    var rx = pad * 2 + leftW;
    return {
      pad: pad, bx: bx, by: by, edge: boardEdge, cell: boardEdge / K.n,
      rx: rx, rw: W - rx - pad, ry: pad, rh: H - pad * 2
    };
  }

  function cellAt(x, y) {
    var L = layout();
    var c = Math.floor((x - L.bx) / L.cell), r = Math.floor((y - L.by) / L.cell);
    if (r < 0 || r >= K.n || c < 0 || c >= K.n) return -1;
    return r * K.n + c;
  }

  function undoBox() {
    var L = layout();
    var h = Math.max(28, L.rh * 0.075);
    return { x: L.rx, y: L.ry + L.rh - h, w: L.rw, h: h };
  }

  function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

  function font(g, px, weight) {
    g.font = (weight ? weight + " " : "") + Math.round(px) +
      "px ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
  }
  function sans(g, px, weight) {
    g.font = (weight ? weight + " " : "") + Math.round(px) +
      "px system-ui, -apple-system, 'PingFang SC', sans-serif";
  }

  return {
    title: "堤坝调水",

    setup: function (env) {
      W = finite(env && env.width, 640);
      H = finite(env && env.height, 640);
      S = fresh();
    },

    resize: function (w, h) { W = finite(w, W); H = finite(h, H); },

    pointer: function (x, y, phase) {
      if (phase !== "down") return;
      if (S.phase === "brief") { S.phase = "play"; return; }
      if (S.phase === "over") {
        if (hit(undoBox(), x, y)) { undo(); return; }
        S = fresh(); S.phase = "play";
        return;
      }
      if (hit(undoBox(), x, y)) { undo(); return; }
      var i = cellAt(x, y);
      if (i >= 0) pour(i);
    },

    key: function (code, phase) {
      if (phase !== "down") return;
      if (S.phase === "brief") { S.phase = "play"; return; }
      if (code === "KeyU" || code === "Backspace") { undo(); return; }
      if (S.phase === "over" && (code === "Space" || code === "Enter")) { S = fresh(); S.phase = "play"; }
    },

    update: function (dt) {
      dt = clamp(finite(dt, 16.67), 0, 50);
      if (!S.chain) return;   // 玩家不动手，世界就不动
      var ch = S.chain;
      ch.timer += dt;
      var step = ch.at < 0 ? K.waveMs * 0.5 : K.waveMs;
      if (ch.timer < step) return;
      ch.timer = 0;
      ch.at += 1;
      if (ch.at < ch.waves.length) {
        S.cells = ch.waves[ch.at].cells.slice();
        return;
      }
      if (ch.at === ch.waves.length) { ch.timer = K.waveMs - K.settleMs; return; }
      S.cells = ch.final.slice();
      S.spill += ch.spill;
      S.chain = null;
      judge();
    },

    draw: function (g) {
      var L = layout();
      g.fillStyle = rgba(PAPER, 1);
      g.fillRect(0, 0, W, H);

      var dim = S.phase === "brief" ? 0.5 : 1;
      var hot = (S.chain && S.chain.at >= 0 && S.chain.at < S.chain.waves.length)
        ? S.chain.waves[S.chain.at].hot : [];

      // 外框：一条墨线圈住整个盘，表示「堤内」。线外就是海。
      g.strokeStyle = rgba(INK, 0.55 * dim);
      g.lineWidth = 2;
      g.strokeRect(L.bx - 6, L.by - 6, L.edge + 12, L.edge + 12);

      for (var i = 0; i < K.n * K.n; i++) {
        var r = Math.floor(i / K.n), c = i % K.n;
        var x = L.bx + c * L.cell, y = L.by + r * L.cell;
        var v = S.cells[i];
        var risky = v > K.safe;
        var toppling = hot.indexOf(i) >= 0;

        // 格底：水位条从底往上长。安全的用中性灰（已确定），危格用墨（还要动它）。
        var fillH = (L.cell - 8) * clamp(v / K.brim, 0, 1);
        g.fillStyle = rgba(risky ? INK : CALM, risky ? 0.16 * dim : 0.22 * dim);
        g.fillRect(x + 4, y + 4 + (L.cell - 8 - fillH), L.cell - 8, fillH);

        g.strokeStyle = rgba(INK, (risky ? 0.75 : 0.28) * dim);
        g.lineWidth = risky ? 2 : 1;
        g.strokeRect(x + 4, y + 4, L.cell - 8, L.cell - 8);

        // 正在漫堤的这一格：加一圈墨，指导要求「看清因果」，不用特效。
        if (toppling) {
          g.strokeStyle = rgba(INK, 0.9);
          g.lineWidth = 3;
          g.strokeRect(x + 1, y + 1, L.cell - 2, L.cell - 2);
        }

        font(g, L.cell * 0.4, risky ? "600" : "400");
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillStyle = rgba(risky ? INK : CALM, (risky ? 0.95 : 0.8) * dim);
        g.fillText(String(v), x + L.cell / 2, y + L.cell / 2);

        // 上一次注水的落点：一个墨点，告诉玩家「你刚动的是这里」。
        if (i === S.pourAt && !S.chain) {
          g.beginPath();
          g.arc(x + L.cell - 14, y + 14, 3.5, 0, Math.PI * 2);
          g.fillStyle = rgba(INK, 0.75 * dim);
          g.fill();
        }
      }

      // 排海：这一波流出堤外的水，只有它用红——红在这一件里只表代价。
      if (hot.length) {
        for (var h = 0; h < hot.length; h++) {
          var hr = Math.floor(hot[h] / K.n), hc = hot[h] % K.n;
          var cx = L.bx + hc * L.cell + L.cell / 2, cy = L.by + hr * L.cell + L.cell / 2;
          var d = [[-1, 0], [1, 0], [0, -1], [0, 1]];
          for (var k = 0; k < 4; k++) {
            var nr = hr + d[k][0], nc = hc + d[k][1];
            if (nr >= 0 && nr < K.n && nc >= 0 && nc < K.n) continue;
            g.beginPath();
            g.moveTo(cx, cy);
            g.lineTo(cx + d[k][1] * L.cell * 0.85, cy + d[k][0] * L.cell * 0.85);
            g.strokeStyle = rgba(COST, 0.8);
            g.lineWidth = 2;
            g.stroke();
          }
        }
      }
    },

    hud: function (g) {
      var L = layout();
      var x = L.rx, y = L.ry;
      var lh = clamp(L.rh * 0.052, 16, 30);

      g.textAlign = "left";
      g.textBaseline = "top";

      sans(g, lh * 0.78, "600");
      g.fillStyle = rgba(INK, 0.95);
      g.fillText("堤坝调水", x, y);
      y += lh * 1.25;

      g.beginPath();
      g.moveTo(x, y); g.lineTo(x + L.rw, y);
      g.strokeStyle = rgba(INK, 0.35); g.lineWidth = 1; g.stroke();
      y += lh * 0.5;

      if (S.phase === "brief") {
        // 首屏：右栏是一整块规则摘要。没有隐藏信息，看完再开局。
        var para = [
          "全盘 16 段堤，数字是水位。",
          "点一格＝开一次上游闸，那一格 +1。",
          "水位到 4 就漫堤：四份水平分给上下左右，",
          "自己退 4；漫到堤外的记作排海。",
          "",
          "赢：全盘降到 " + K.safe + " 以内。",
          "输：闸次用完仍有高水位，或排海超配额。",
          "",
          "闸次 " + K.gates + " 次　排海配额 " + K.quota + " 份",
          "没有计时器，想多久都行。",
          "按 U 撤销上一步。",
          "",
          "点任意处开局。"
        ];
        // 右栏比字宽窄的时候必须自己折行：规则读不全等于隐藏信息，这个风格里不许有。
        sans(g, Math.min(lh * 0.62, L.rw / 13.5));
        var lines = [];
        for (var p = 0; p < para.length; p++) {
          var text = para[p];
          if (!text) { lines.push(""); continue; }
          var cur = "";
          for (var ci = 0; ci < text.length; ci++) {
            var probe = cur + text.charAt(ci);
            if (g.measureText(probe).width > L.rw && cur) { lines.push(cur); cur = text.charAt(ci); }
            else cur = probe;
          }
          lines.push(cur);
        }
        for (var i = 0; i < lines.length; i++) {
          g.fillStyle = rgba(INK, lines[i].indexOf("赢：") === 0 || lines[i].indexOf("输：") === 0 ? 0.9 : 0.72);
          g.fillText(lines[i], x, y);
          y += lh * 0.78;
        }
        return;
      }

      // 账目表：剩几次、排了多少、还差几格、上一步做了什么，全部同屏。
      var rows = [
        ["闸次", (K.gates - S.gatesUsed) + " / " + K.gates + " 剩", INK],
        ["排海", S.spill + " / " + K.quota + " 份", COST],
        ["高水位", threes(S.cells) + " 段待降", INK]
      ];
      for (var j = 0; j < rows.length; j++) {
        sans(g, lh * 0.6);
        g.fillStyle = rgba(CALM, 1);
        g.fillText(rows[j][0], x, y);
        font(g, lh * 0.78, "600");
        g.textAlign = "right";
        g.fillStyle = rgba(rows[j][2], 0.95);
        g.fillText(rows[j][1], x + L.rw, y - lh * 0.08);
        g.textAlign = "left";
        y += lh * 1.15;
      }

      y += lh * 0.3;
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x + L.rw, y);
      g.strokeStyle = rgba(INK, 0.18); g.lineWidth = 1; g.stroke();
      y += lh * 0.45;

      sans(g, lh * 0.6);
      g.fillStyle = rgba(CALM, 1);
      g.fillText("上一步", x, y);
      y += lh * 0.85;
      sans(g, lh * 0.62);
      g.fillStyle = rgba(INK, 0.85);
      if (S.last) {
        var rr = Math.floor(S.last.at / K.n) + 1, cc = (S.last.at % K.n) + 1;
        g.fillText("第 " + rr + " 行第 " + cc + " 列注水", x, y);
        y += lh * 0.8;
        g.fillText("漫堤 " + S.last.waves + " 波", x, y);
        g.fillStyle = rgba(COST, 0.9);
        g.fillText("　排海 " + S.last.out + " 份", x + L.rw * 0.45, y);
      } else {
        g.fillText("还没有落子", x, y);
      }
      y += lh * 1.3;

      if (S.chain) {
        sans(g, lh * 0.6);
        g.fillStyle = rgba(INK, 0.7);
        g.fillText("正在推演第 " + clamp(S.chain.at + 1, 1, S.chain.waves.length) +
          " / " + S.chain.waves.length + " 波", x, y);
      }

      if (S.phase === "over") {
        var oy = L.ry + L.rh * 0.62;
        sans(g, lh * 1.15, "600");
        g.fillStyle = rgba(S.over === "win" ? INK : COST, 1);
        g.fillText(S.over === "win" ? "调水完成" : "决堤", x, oy);
        sans(g, lh * 0.62);
        g.fillStyle = rgba(INK, 0.8);
        g.fillText(S.over === "win"
          ? "用 " + S.gatesUsed + " 闸次，排海 " + S.spill + " 份。"
          : (S.spill > K.quota ? "排海 " + S.spill + " 份，超配额 " + (S.spill - K.quota) + " 份。"
            : "闸次用完，仍有 " + threes(S.cells) + " 段高水位。"), x, oy + lh * 1.3);
        g.fillStyle = rgba(CALM, 1);
        g.fillText("点盘面重开一局", x, oy + lh * 2.1);
      }

      // 撤销条：这个风格里唯一允许的容错，永远摆在同一个位置。
      var b = undoBox();
      g.strokeStyle = rgba(INK, S.history.length ? 0.5 : 0.15);
      g.lineWidth = 1;
      g.strokeRect(b.x, b.y, b.w, b.h);
      sans(g, lh * 0.62);
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillStyle = rgba(INK, S.history.length ? 0.85 : 0.3);
      g.fillText("撤销上一步（U）", b.x + b.w / 2, b.y + b.h / 2);
      g.textAlign = "left";
      g.textBaseline = "top";
    },

    __probe: function () {
      return {
        phase: S.phase, over: S.over, cells: S.cells.slice(),
        gatesUsed: S.gatesUsed, gatesLeft: K.gates - S.gatesUsed,
        spill: S.spill, quota: K.quota, risky: threes(S.cells),
        chaining: Boolean(S.chain), canUndo: S.history.length > 0,
        last: S.last ? { at: S.last.at, waves: S.last.waves, out: S.last.out } : null
      };
    }
  };
})();


(function () {
  "use strict";
  var cv = document.getElementById("stage");
  var g = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, started = false;

  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (started && bundle.resize) bundle.resize(W, H);
  }

  fit();
  bundle.setup({ ctx: g, canvas: cv, width: W, height: H });
  started = true;
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  function at(e) {
    var r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function on(name, phase) {
    cv.addEventListener(name, function (e) {
      var p = at(e);
      bundle.pointer(p[0], p[1], phase);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  }
  on("pointerdown", "down");
  on("pointermove", "move");
  on("pointerup", "up");
  cv.addEventListener("pointercancel", function () { bundle.pointer(-1, -1, "up"); });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    bundle.key(e.code || e.key, "down");
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { bundle.key(e.code || e.key, "up"); });

  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(ts - last, 50) : 16.67;
    last = ts;
    bundle.update(dt, ts);
    bundle.draw(g, ts);
    bundle.hud(g, ts);
    window.requestAnimationFrame(loop);
  }
  window.requestAnimationFrame(loop);
})();

</script>
