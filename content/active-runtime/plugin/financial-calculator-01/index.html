<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金融计算器</title>
<!--
  规格：docs/specs/oceanleo-plugins-v1/plugins/financial-calculator.md（oceandino 仓）

  承载要求（给嵌入方）：必须放进 sandbox="allow-scripts" 的 iframe，绝不与 allow-same-origin 同给；
  可执行内容由 oceanleo.app 隔离域提供，不在 oceanleo.com 同源执行；零外部资源、零存储、零请求、不访问 parent/top。

  经典 <script src> 而非 type="module"：不透明源下模块脚本按 CORS 取回会失败。
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet">

  <div class="chart" id="chart">
    <svg class="plot" id="plot" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <path class="shade" id="shade"></path>
      <path class="past" id="past"></path>
      <line class="zero" id="zero" x1="0" x2="1000" y1="500" y2="500"></line>
      <path class="now" id="now"></path>
      <circle class="marker" id="marker" r="5" cx="0" cy="0" visibility="hidden"></circle>
    </svg>

    <p class="verdict" id="verdict"></p>
    <p class="past-name" id="past-name" hidden></p>
    <div class="readout" id="readout" hidden></div>
    <div class="axis" id="axis"></div>
  </div>

  <form class="band" id="band" autocomplete="off">
    <div class="knobs" id="knobs-loan">
      <label class="knob"><span>本金</span><input id="principal" type="text" inputmode="decimal" spellcheck="false"><b>元</b></label>
      <label class="knob"><span>年利率</span><input id="rate" type="text" inputmode="decimal" spellcheck="false"><b>%</b></label>
      <label class="knob"><span>还款方式</span><select id="method"><option value="annuity">等额本息</option><option value="equal-principal">等额本金</option></select></label>
      <label class="knob term"><span>期限</span><input id="term" type="range" min="1" max="40" step="1"><b id="term-read">30 年 · 360 期</b></label>
    </div>

    <div class="knobs" id="knobs-cash" hidden>
      <label class="knob"><span>折现率</span><input id="discount" type="text" inputmode="decimal" spellcheck="false"><b>%</b></label>
      <label class="knob wide"><span>每期现金流</span><input id="flows" type="text" inputmode="text" spellcheck="false"><b>元</b></label>
    </div>

    <div class="question" role="group" aria-label="要算哪件事">
      <button type="button" id="ask-loan" class="on">贷款还清轨迹</button>
      <button type="button" id="ask-cash">现金流折现</button>
    </div>
  </form>

</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
