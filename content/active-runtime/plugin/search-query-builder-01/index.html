<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检索式构造</title>
<!--
  规格：docs/specs/oceanleo-plugins-v1/plugins/search-query-builder.md（oceandino 仓）

  经典 <script src> 而非 type="module"：不透明源下模块脚本按 CORS 取回会失败。
  零外部资源、零存储、零网络请求、不访问 parent/top。
  它编译查询串，不替用户执行检索。
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="desk">

  <p class="origin"><button id="origin" type="button" hidden></button></p>

  <div class="stage">
    <div class="typeset" id="typeset"></div>
    <p class="baseline" id="baseline"></p>
    <p class="hand">
      <button id="copy" type="button" hidden>复制</button>
      <span class="banks" id="banks"></span>
    </p>
    <textarea id="carry" readonly tabindex="-1" aria-hidden="true"></textarea>
    <p class="verdict" id="verdict"></p>
  </div>

  <form class="ask" id="ask" autocomplete="off">
    <label class="q" id="q" for="answer"></label>
    <input id="answer" type="text" autocomplete="off" spellcheck="false">
    <button id="more" type="button" hidden>再加一个概念</button>
  </form>

</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
