<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>可执行笔记</title>
  <!--
    规格：docs/specs/oceanleo-plugins-v1/plugins/executable-notebook.md（oceandino 仓）

    经典 <script src>，不是 type="module"：不透明源下模块脚本按 CORS 取回会失败。
    零外部资源、零存储、零网络请求、不访问 parent/top。
    只认封闭数学表达式，不执行用户写的自由代码；不读时钟、不产生随机数。
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="paper">

    <p class="headline" id="headline"></p>

    <div class="scroll" id="scroll">
      <div class="doc" id="doc"></div>

      <form class="tail" id="tail" autocomplete="off">
        <input id="new-name" class="hand name" placeholder="水电 utilities" aria-label="名字">
        <input id="new-body" class="hand body" placeholder="8600 元/月" aria-label="内容">
        <button id="add" type="submit">写下</button>
      </form>
    </div>

  </main>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
