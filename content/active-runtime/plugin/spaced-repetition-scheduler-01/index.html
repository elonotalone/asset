<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>间隔排程</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="desk">
  <div class="headline" id="headline" hidden></div>

  <section class="card card-new" id="new-card" aria-label="新建一张卡">
    <label class="sr" for="front">你想让自己记住什么</label>
    <textarea id="front" class="face-write" rows="2" spellcheck="false" autofocus
      placeholder="你想让自己记住什么"></textarea>
    <div id="back-wrap" hidden>
      <label class="sr" for="back">核对时要看到的答案</label>
      <textarea id="back" class="face-write face-back" rows="3" spellcheck="false"
        placeholder="再写下核对时要看到的答案"></textarea>
    </div>
    <div class="act" id="new-act" hidden>
      <button id="keep" class="go" type="button">开始记它</button>
      <p id="new-warn" class="warn" role="alert"></p>
    </div>
  </section>

  <section class="card" id="review" hidden aria-label="今天该复习的这张卡"></section>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
