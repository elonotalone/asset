<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口播脚本</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="workbench">
  <header class="head">
    <h1>口播脚本</h1>
    <p>先定时长，再让每段口播、停顿、字幕与画面备注落到同一条时间轴</p>
  </header>

  <div class="workbench-body">
    <aside class="assumptions" aria-label="时间假设与段落编辑">
      <section>
        <h2>时间假设</h2>
        <label class="field">目标时长（秒）
          <input id="target-seconds" type="number" min="1" step="1" placeholder="先填写，例如 90">
        </label>
        <label class="field">中文语速（字/分钟）
          <input id="chinese-rate" type="number" min="1" step="1" value="216">
        </label>
        <label class="field">英文语速（词/分钟）
          <input id="english-rate" type="number" min="1" step="1" value="150">
        </label>
        <label class="field">视频帧率（fps）
          <input id="fps" type="number" min="1" step="1" value="25">
        </label>
        <p class="basis">普通中文口播从约 216 字/分钟开始。中文按字、英文按词；中英混排分别计时后相加，两种计数单位不等价。标点与空格不计。</p>
        <div class="side-actions">
          <button id="add-segment" type="button" disabled>添加第一段</button>
          <button id="load-demo" type="button">载入可复核示例</button>
        </div>
      </section>

      <section id="editor" class="editor" hidden>
        <h2 id="editor-title">添加段落</h2>
        <label class="field">段落标题
          <input id="segment-title" type="text" placeholder="例如：开场提问">
        </label>
        <label class="field">语言口径
          <select id="language-mode">
            <option value="zh">中文 · 按字</option>
            <option value="en">英文 · 按词</option>
            <option value="mixed">中英混排 · 分开计</option>
          </select>
        </label>
        <label class="field">口播正文
          <textarea id="segment-text" rows="4" placeholder="写下这一段真正会说出口的话"></textarea>
        </label>
        <label class="field">段后停顿（秒）
          <input id="pause-seconds" type="number" min="0" step="0.1" value="0.5">
        </label>
        <label class="field">字幕
          <textarea id="subtitle" rows="2" placeholder="可与口播不同，但时间码跟随本段"></textarea>
        </label>
        <label class="field">画面备注
          <textarea id="visual-note" rows="2" placeholder="例如：镜头切到逐年增长的数字"></textarea>
        </label>
        <div class="side-actions">
          <button id="save-segment" type="button">保存段落</button>
          <button id="cancel-edit" type="button">取消</button>
        </div>
      </section>
    </aside>

    <div class="ledger">
      <section class="conclusions" aria-label="时间轴结论">
        <h2>时间轴与预算</h2>
        <div class="headline">
          <div><span>时间轴</span><strong id="time-range">待填写</strong></div>
          <div><span>中文预算</span><strong id="budget">待填写</strong></div>
          <div><span>已用</span><strong id="used">0:00</strong></div>
          <div><span>剩余</span><strong id="remaining">待填写</strong></div>
        </div>
        <p id="calculation-basis" class="calculation-basis">填入目标时长后：中文预算 = 目标秒数 × 216 ÷ 60；逐段时间码按 25 fps 对齐到整帧。</p>
      </section>

      <section class="detail" aria-label="逐段时间明细">
        <div class="section-head">
          <h2>逐段时间明细</h2>
          <span id="row-count">0 段</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>段落</th><th>口径 / 计数</th><th>起点</th><th>终点</th><th>口播</th><th>停顿</th><th>操作</th></tr>
            </thead>
            <tbody id="timeline-body"></tbody>
          </table>
          <p id="empty-state" class="empty-state">还没有段落。先填写目标时长，再添加第一段。</p>
        </div>
      </section>

      <section class="export" aria-label="可带走的脚本">
        <div class="section-head">
          <h2>可带走的时间码脚本</h2>
          <span>可手动选中，不依赖剪贴板</span>
        </div>
        <textarea id="export-output" rows="8" readonly></textarea>
      </section>
    </div>
  </div>

  <footer class="foot">
    <button id="run-test" type="button">运行自测</button>
    <span id="test-out">未运行</span>
    <ul id="test-detail"></ul>
  </footer>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
