<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台账</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="roll">
  <form id="entry-form" class="stream" autocomplete="off">
    <div class="paper" id="paper">
      <table>
        <thead><tr id="roll-head"></tr></thead>
        <tbody id="roll-body"></tbody>
        <tfoot>
          <tr id="entry-row" class="entry"></tr>
        </tfoot>
      </table>
      <p id="entry-why" class="why" role="alert" hidden></p>
      <p class="tail">
        <button id="takeaway-open" type="button" aria-expanded="false">带走这份账</button>
        <span id="volatile" class="volatile">刷新这一页，记下的账就没了</span>
      </p>
      <pre id="takeaway" hidden></pre>
    </div>
  </form>

  <p class="reading">
    <button id="reading-name" class="reading-name" type="button" aria-expanded="false"></button>
    <output id="reading-value" class="reading-value"></output><b id="reading-unit" class="reading-unit"></b>
    <span id="latest" class="latest"></span>
    <span id="as-of" class="as-of" hidden>
      <label for="as-of-date">基准日</label><input id="as-of-date" type="date">
    </span>
    <span id="reconcile" class="reconcile" hidden></span>
  </p>
  <div id="uses" class="uses" hidden></div>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
