<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三表模型</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="rig">
  <p id="verdict" class="verdict" aria-live="polite"></p>
  <p id="trace" class="trace"></p>

  <div id="stack" class="stack">
    <svg id="drive" class="drive" aria-hidden="true"></svg>

    <section class="deck" data-deck="income" aria-label="利润表">
      <span class="plate">利润表</span>
      <table>
        <thead>
          <tr><td class="rowname"></td><th scope="col">2027E</th><th scope="col">2028E</th><th scope="col">2029E</th></tr>
        </thead>
        <tbody>
          <tr data-row="revenue">
            <th scope="row" class="rowname">
              <span class="term">收入</span>
              <span class="knob"><label for="k-baseRevenue">基期收入</label><input id="k-baseRevenue" data-knob="baseRevenue" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="9"><b>元</b></span>
              <span class="knob"><label for="k-revenueGrowth">收入增速</label><input id="k-revenueGrowth" data-knob="revenueGrowth" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="5"><b>%</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="depreciation">
            <th scope="row" class="rowname">
              <span class="term">折旧</span>
              <span class="knob"><label for="k-capexPct">资本开支率</label><input id="k-capexPct" data-knob="capexPct" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="5"><b>%</b></span>
              <span class="knob"><label for="k-depreciationYears">折旧年限</label><input id="k-depreciationYears" data-knob="depreciationYears" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" size="3"><b>年</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="ebit">
            <th scope="row" class="rowname">
              <button class="term open" type="button" data-open="ebit" aria-expanded="false">EBIT</button>
              <span class="knob"><label for="k-grossMargin">毛利率</label><input id="k-grossMargin" data-knob="grossMargin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="5"><b>%</b></span>
              <span class="knob"><label for="k-operatingExpensePct">运营费用率</label><input id="k-operatingExpensePct" data-knob="operatingExpensePct" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="5"><b>%</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="cogs" data-under="ebit" hidden>
            <th scope="row" class="rowname"><span class="term">销售成本</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="grossProfit" data-under="ebit" hidden>
            <th scope="row" class="rowname"><span class="term">毛利</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="operatingExpense" data-under="ebit" hidden>
            <th scope="row" class="rowname"><span class="term">运营费用</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="netIncome">
            <th scope="row" class="rowname">
              <button class="term open" type="button" data-open="netIncome" aria-expanded="false">净利润</button>
              <span class="knob"><label for="k-taxRate">税率</label><input id="k-taxRate" data-knob="taxRate" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="5"><b>%</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="interest" data-under="netIncome" hidden>
            <th scope="row" class="rowname"><span class="term">利息</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="pretaxIncome" data-under="netIncome" hidden>
            <th scope="row" class="rowname"><span class="term">税前利润</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="tax" data-under="netIncome" hidden>
            <th scope="row" class="rowname"><span class="term">所得税</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="deck" data-deck="cashflow" aria-label="现金流量表">
      <span class="plate">现金流量表</span>
      <table>
        <thead>
          <tr><td class="rowname"></td><th scope="col">2027E</th><th scope="col">2028E</th><th scope="col">2029E</th></tr>
        </thead>
        <tbody>
          <tr data-row="cfNetIncome">
            <th scope="row" class="rowname"><span class="term">净利润</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="cfDepreciation">
            <th scope="row" class="rowname"><span class="term">折旧加回</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="cfReceivables">
            <th scope="row" class="rowname"><span class="term">应收占用</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="operatingCashFlow">
            <th scope="row" class="rowname">
              <button class="term open" type="button" data-open="operatingCashFlow" aria-expanded="false">经营现金流</button>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="cfInventory" data-under="operatingCashFlow" hidden>
            <th scope="row" class="rowname"><span class="term">存货占用</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="cfPayables" data-under="operatingCashFlow" hidden>
            <th scope="row" class="rowname"><span class="term">应付释放</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="endingCash">
            <th scope="row" class="rowname">
              <button class="term open" type="button" data-open="endingCash" aria-expanded="false">期末现金</button>
              <span class="knob"><label for="k-minimumCash">最低现金</label><input id="k-minimumCash" data-knob="minimumCash" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="8"><b>元</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="openingCash" data-under="endingCash" hidden>
            <th scope="row" class="rowname"><span class="term">期初现金</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="capex" data-under="endingCash" hidden>
            <th scope="row" class="rowname"><span class="term">资本开支</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="preFinanceCash" data-under="endingCash" hidden>
            <th scope="row" class="rowname"><span class="term">融资前现金</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="revolverChange" data-under="endingCash" hidden>
            <th scope="row" class="rowname"><span class="term">循环贷变动</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="deck" data-deck="balance" aria-label="资产负债表">
      <span class="plate">资产负债表</span>
      <table>
        <thead>
          <tr><td class="rowname"></td><th scope="col">2027E</th><th scope="col">2028E</th><th scope="col">2029E</th></tr>
        </thead>
        <tbody>
          <tr data-row="cash">
            <th scope="row" class="rowname"><span class="term">现金</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="receivables">
            <th scope="row" class="rowname">
              <span class="term">应收</span>
              <span class="knob"><label for="k-dso">应收周转天数</label><input id="k-dso" data-knob="dso" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" size="4"><b>天</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="inventory">
            <th scope="row" class="rowname">
              <span class="term">存货</span>
              <span class="knob"><label for="k-inventoryDays">存货天数</label><input id="k-inventoryDays" data-knob="inventoryDays" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" size="4"><b>天</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="ppe">
            <th scope="row" class="rowname"><span class="term">固定资产净额</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="jaw" data-row="assets">
            <th scope="row" class="rowname"><span class="term">资产合计</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="gap" data-row="difference" hidden>
            <th scope="row" class="rowname"><span class="term">差额</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="jaw" data-row="liabilitiesAndEquity">
            <th scope="row" class="rowname">
              <button class="term open" type="button" data-open="liabilitiesAndEquity" aria-expanded="false">负债权益合计</button>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="payables">
            <th scope="row" class="rowname">
              <span class="term">应付</span>
              <span class="knob"><label for="k-payableDays">应付天数</label><input id="k-payableDays" data-knob="payableDays" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" size="4"><b>天</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="revolver">
            <th scope="row" class="rowname">
              <span class="term">循环贷</span>
              <span class="knob"><label for="k-interestRate">循环贷利率</label><input id="k-interestRate" data-knob="interestRate" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" size="5"><b>%</b></span>
            </th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr data-row="retainedEarnings">
            <th scope="row" class="rowname"><span class="term">未分配利润</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
          <tr class="inner" data-row="shareCapital" data-under="liabilitiesAndEquity" hidden>
            <th scope="row" class="rowname"><span class="term">股本</span></th>
            <td data-year="0"></td><td data-year="1"></td><td data-year="2"></td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
