<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="city" id="city">
  <svg id="plane" xmlns="http://www.w3.org/2000/svg" aria-label="按真实比例摆开的地点与路线">
    <g id="grid-layer" aria-hidden="true"></g>
    <g id="area-layer"></g>
    <g id="route-layer"></g>
    <g id="place-layer"></g>
    <g id="label-layer"></g>
    <g id="mark-layer" aria-hidden="true"></g>
  </svg>

  <output class="headline" id="total" aria-live="polite"></output>
  <div class="advice" id="advice" hidden></div>
  <div class="tag" id="tag" hidden></div>

  <form class="entry" id="entry" autocomplete="off">
    <input id="paste" type="text" size="34" aria-label="朋友发来的地图链接，或一对坐标"
           placeholder="粘贴朋友发来的地图链接，或一对坐标">
    <input id="place-name" type="text" size="18" aria-label="这个地点叫什么" placeholder="这里叫什么">
    <button id="add-place" type="submit">落下</button>
    <span class="cue" id="cue"></span>
  </form>
</div>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
