<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关系图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="table" id="table">
  <svg id="web" xmlns="http://www.w3.org/2000/svg" aria-label="材料里已经写明的关系">
    <defs>
      <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 1 1 L 11 6 L 1 11 z" fill="#8f8577"></path>
      </marker>
      <marker id="arrow-lit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 1 1 L 11 6 L 1 11 z" fill="#e8c07a"></path>
      </marker>
    </defs>
    <g id="edge-layer"></g>
    <g id="relation-layer"></g>
    <g id="node-layer"></g>
  </svg>

  <output class="conclusion" id="conclusion" aria-live="polite"></output>

  <form class="entry" id="entry" autocomplete="off">
    <input id="from" type="text" size="12" aria-label="谁" placeholder="谁">
    <input id="relation" type="text" size="12" aria-label="什么关系" placeholder="什么关系">
    <input id="to" type="text" size="12" aria-label="和谁" placeholder="和谁">
    <input id="date" type="text" size="10" aria-label="材料里写的日期，可以不填" placeholder="日期，可不填">
    <button id="add-relation" type="submit">记下</button>
    <span class="cue" id="cue">写下谁、什么关系、和谁</span>
  </form>
</div>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
