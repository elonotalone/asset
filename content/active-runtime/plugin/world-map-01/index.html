<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="map-shell">
    <div id="map" class="map" aria-label="世界城市地图"></div>

    <form id="journey-form" class="journey" autocomplete="off">
      <label class="place-field">
        <span>从</span>
        <input id="from-place" name="from" value="北京" aria-describedby="from-message">
        <small id="from-message" aria-live="polite"></small>
      </label>
      <span class="arrow" aria-hidden="true">→</span>
      <label class="place-field">
        <span>到</span>
        <input id="to-place" name="to" value="赫尔辛基" aria-describedby="to-message">
        <small id="to-message" aria-live="polite"></small>
      </label>
      <button type="submit">在地图上查看</button>
    </form>

    <p id="summary" class="summary" aria-live="polite">正在打开地图…</p>

    <section id="load-failure" class="load-failure" hidden aria-live="assertive">
      <p>地图暂时没加载出来。可能是网络受限或服务繁忙，请检查网络后重试。</p>
      <button id="retry-map" type="button">重新加载地图</button>
    </section>
  </main>

  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
