<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献矩阵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet">
  <p class="tally">
    <output id="tally">0</output>
    <span class="what">最终纳入</span>
    <span id="unread" class="off" hidden></span>
    <button id="unknown" class="off pick" type="button" hidden aria-pressed="false"></button>
  </p>

  <div class="scroll" id="scroll">
    <table>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <form class="paste" id="paste-form">
    <textarea id="paste" rows="2" spellcheck="false" aria-label="把题录整批粘进来"
      placeholder="Chen 2024 | 随机对照试验 | 社区老年人 | 286 | 纳入"></textarea>
    <button id="import" type="submit">导入</button>
  </form>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
