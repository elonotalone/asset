<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./engine.js" defer></script>
    <script src="./ui.js" defer></script>
  </head>
  <body>
    <main class="graph-stage" aria-label="概念学习关系图">
      <p id="learnable-summary" class="learnable-summary" aria-live="polite">
        现在可以学 0 个概念
      </p>

      <div id="graph-viewport" class="graph-viewport">
        <svg
          id="graph-canvas"
          class="graph-canvas"
          role="img"
          aria-label="概念与先修关系"
        >
          <defs>
            <pattern id="draft-grid" width="32" height="32" patternUnits="userSpaceOnUse">
              <path d="M 32 0 L 0 0 0 32" class="grid-line" />
            </pattern>
            <marker
              id="required-arrow"
              markerWidth="9"
              markerHeight="9"
              refX="8"
              refY="4.5"
              orient="auto"
              markerUnits="strokeWidth"
            >
              <path d="M 0 0 L 9 4.5 L 0 9 Z" class="required-arrowhead" />
            </marker>
            <marker
              id="related-arrow"
              markerWidth="9"
              markerHeight="9"
              refX="8"
              refY="4.5"
              orient="auto"
              markerUnits="strokeWidth"
            >
              <path d="M 0 0 L 9 4.5 L 0 9 Z" class="related-arrowhead" />
            </marker>
            <marker
              id="path-arrow"
              markerWidth="10"
              markerHeight="10"
              refX="9"
              refY="5"
              orient="auto"
              markerUnits="strokeWidth"
            >
              <path d="M 0 0 L 10 5 L 0 10 Z" class="path-arrowhead" />
            </marker>
            <filter id="path-glow" x="-35%" y="-45%" width="170%" height="190%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feFlood flood-color="#e87832" flood-opacity="0.42" result="color" />
              <feComposite in="color" in2="blur" operator="in" result="glow" />
              <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect class="grid-field" width="100%" height="100%" />
          <g id="graph-edges"></g>
          <g id="graph-nodes"></g>
        </svg>
      </div>

      <form id="concept-entry" class="concept-entry" novalidate>
        <label id="entry-question" class="entry-question" for="concept-input">
          先写下你要弄懂的第一个概念
        </label>
        <div class="entry-line">
          <input
            id="concept-input"
            name="concept"
            type="text"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="entry-feedback"
          />
          <button id="entry-submit" class="entry-submit" type="submit">
            写进图里
          </button>
        </div>
        <button id="sample-trigger" class="sample-trigger" type="button">
          看看电磁感应示例
        </button>
        <p id="entry-feedback" class="entry-feedback" role="status"></p>
      </form>
    </main>
  </body>
</html>
