<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>医疗计算器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet">
  <header class="mast">
    <h1>医疗计算器</h1>
  </header>

  <nav class="metric-strip" aria-label="选择计算指标">
    <button class="metric-tab is-current" type="button" data-metric="bmi" aria-current="true">
      <span>体质指数</span><output id="bmi-mini">—</output>
    </button>
    <button class="metric-tab" type="button" data-metric="bsa">
      <span>体表面积</span><output id="bsa-mini">—</output>
    </button>
    <button class="metric-tab" type="button" data-metric="egfr">
      <span>eGFR</span><output id="egfr-mini">—</output>
    </button>
    <button class="metric-tab" type="button" data-metric="calcium">
      <span>校正钙</span><output id="calcium-mini">—</output>
    </button>
  </nav>

  <section class="focus" aria-labelledby="hero-name">
    <p id="prompt" class="prompt">先说身高和体重</p>

    <div class="hero" aria-live="polite">
      <output id="hero-value" class="hero-value" aria-label="尚未计算">—</output>
      <h2 id="hero-name">体质指数 BMI</h2>
      <p id="hero-unit" class="hero-unit">kg/m²</p>
    </div>

    <div class="input-area">
      <fieldset class="input-set" data-inputs="body">
        <legend>先说身高和体重</legend>
        <label>
          <span>身高</span>
          <span class="entry"><input id="height" type="text" inputmode="decimal" autocomplete="off" aria-label="身高，厘米"><b>cm</b></span>
        </label>
        <label>
          <span>体重</span>
          <span class="entry"><input id="weight" type="text" inputmode="decimal" autocomplete="off" aria-label="体重，千克"><b>kg</b></span>
        </label>
      </fieldset>

      <fieldset class="input-set" data-inputs="egfr" hidden>
        <legend>告诉我年龄、性别和肌酐</legend>
        <label>
          <span>年龄</span>
          <span class="entry"><input id="age" type="text" inputmode="decimal" autocomplete="off" aria-label="年龄，岁"><b>岁</b></span>
        </label>
        <label>
          <span>性别参数</span>
          <span class="entry"><select id="sex" aria-label="eGFR 公式性别参数"><option value="">未选择</option><option value="female">女</option><option value="male">男</option></select></span>
        </label>
        <label class="wide-field">
          <span>血清肌酐</span>
          <span class="entry creatinine-entry">
            <input id="creatinine" type="text" inputmode="decimal" autocomplete="off" aria-label="血清肌酐">
            <select id="creatinine-unit" aria-label="血清肌酐单位"><option value="mgdl">mg/dL</option><option value="umoll">µmol/L</option></select>
          </span>
        </label>
      </fieldset>

      <fieldset class="input-set" data-inputs="calcium" hidden>
        <legend>填入测得钙和白蛋白</legend>
        <label>
          <span>测得钙</span>
          <span class="entry"><input id="calcium" type="text" inputmode="decimal" autocomplete="off" aria-label="测得钙，毫克每分升"><b>mg/dL</b></span>
        </label>
        <label>
          <span>白蛋白</span>
          <span class="entry"><input id="albumin" type="text" inputmode="decimal" autocomplete="off" aria-label="白蛋白，克每分升"><b>g/dL</b></span>
        </label>
      </fieldset>
      <p id="input-message" class="input-message" aria-live="polite"></p>
    </div>
  </section>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
