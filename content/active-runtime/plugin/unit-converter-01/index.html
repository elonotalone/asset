<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>换算器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pair" id="pair">

  <section class="side left" id="side-left">
    <p class="role" id="role-left">原数</p>
    <input class="num" id="value-left" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="左端的数">
    <select class="unit" id="unit-left" aria-label="左端的单位"></select>
  </section>

  <div class="bridge" id="bridge">
    <svg class="band across" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="taut" d="M0 42 H100 V58 H0 Z"></path>
      <path class="soft" d="M0 40 C 26 40, 30 46, 50 46 C 70 46, 74 40, 100 40 L100 60 C 74 60, 70 54, 50 54 C 30 54, 26 60, 0 60 Z"></path>
    </svg>
    <svg class="band down" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="taut" d="M42 0 V100 H58 V0 Z"></path>
      <path class="soft" d="M40 0 C 40 26, 46 30, 46 50 C 46 70, 40 74, 40 100 L60 100 C 60 74, 54 70, 54 50 C 54 30, 60 26, 60 0 Z"></path>
    </svg>
    <p class="relation" id="relation"></p>
  </div>

  <section class="side right" id="side-right">
    <p class="role" id="role-right">结果</p>
    <input class="num" id="value-right" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="右端的数">
    <select class="unit" id="unit-right" aria-label="右端的单位"></select>
  </section>

</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
