<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>户型标注</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="table">
  <div class="sheet" id="sheet">
    <svg id="paper" xmlns="http://www.w3.org/2000/svg" aria-label="按实测尺寸画出的户型图">
      <g id="grid-layer" aria-hidden="true"></g>
      <g id="room-layer"></g>
      <g id="wall-layer"></g>
      <g id="opening-layer"></g>
      <g id="dimension-layer"></g>
      <g id="room-label-layer"></g>
      <g id="draft-layer" aria-hidden="true"></g>
      <g id="mark-layer" aria-hidden="true"></g>
    </svg>
    <output class="headline" id="suite-area" aria-live="polite"></output>
    <div class="cue" id="cue">拖出第一面墙</div>
    <div class="tag" id="tag" hidden></div>
  </div>
</div>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
