<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自测卷</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet">
  <div class="wrapup" id="wrapup" hidden></div>

  <nav class="edge" id="edge" hidden>
    <button class="edge-go" id="go-prev" type="button" hidden>
      <span class="edge-dir">上一题</span>
      <span class="edge-name" id="prev-name"></span>
    </button>
    <button class="edge-go edge-right" id="go-next" type="button" hidden>
      <span class="edge-dir">下一题</span>
      <span class="edge-name" id="next-name"></span>
    </button>
  </nav>

  <section class="page" id="compose" aria-label="写下要检验自己的问题">
    <label class="sr" for="prompt">要检验的问题</label>
    <textarea id="prompt" class="prompt-write" rows="2" spellcheck="false" autofocus
      placeholder="你想检验自己是否真的会了什么"></textarea>

    <div class="how" id="how" hidden>
      <span class="how-lead">这道题怎么答</span>
      <div class="how-kinds" id="kinds" role="group" aria-label="这道题怎么答"></div>
    </div>

    <div class="build" id="build" hidden></div>

    <div class="extra" id="extra" hidden>
      <input id="topic" class="write-line" type="text" spellcheck="false"
        placeholder="这题考的知识点" aria-label="这题考的知识点">
      <textarea id="explanation" class="write-line" rows="2" spellcheck="false"
        placeholder="答完之后想提醒自己什么" aria-label="答完之后想提醒自己什么"></textarea>
    </div>

    <div class="act" id="compose-act" hidden>
      <button id="start-answer" class="go" type="button">开始答这道题</button>
      <p id="compose-warn" class="warn" role="alert"></p>
    </div>
  </section>

  <section class="page" id="live" hidden aria-label="当前这道题"></section>
</main>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
