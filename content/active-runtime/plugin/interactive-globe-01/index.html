<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地球仪</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="space" aria-label="交互式地球仪">
    <p class="instruction" id="globe-instruction">拖动地球；点一个国家，把它加进这次行程</p>

    <section class="globe-stage" aria-label="行程地球">
      <svg id="world-globe" viewBox="0 0 720 720" role="img"
        aria-label="可拖动并点击添加目的地的离线地球" tabindex="0">
        <defs>
          <clipPath id="globe-clip">
            <circle cx="360" cy="360" r="282"></circle>
          </clipPath>

          <radialGradient id="atmosphere-glow">
            <stop offset="0" stop-color="#0a6ed6" stop-opacity="0"></stop>
            <stop offset=".76" stop-color="#0a6ed6" stop-opacity="0"></stop>
            <stop offset=".86" stop-color="#279bff" stop-opacity=".18"></stop>
            <stop offset=".91" stop-color="#66c9ff" stop-opacity=".62"></stop>
            <stop offset=".96" stop-color="#247dff" stop-opacity=".28"></stop>
            <stop offset="1" stop-color="#0a54d5" stop-opacity="0"></stop>
          </radialGradient>

          <radialGradient id="ocean-paint" cx="30%" cy="23%" r="82%">
            <stop offset="0" stop-color="#217da8"></stop>
            <stop offset=".34" stop-color="#0c507d"></stop>
            <stop offset=".7" stop-color="#05264b"></stop>
            <stop offset="1" stop-color="#020b20"></stop>
          </radialGradient>

          <radialGradient id="land-paint" cx="29%" cy="22%" r="94%">
            <stop offset="0" stop-color="#dce0c0"></stop>
            <stop offset=".35" stop-color="#9dad83"></stop>
            <stop offset=".68" stop-color="#536d58"></stop>
            <stop offset="1" stop-color="#213d3d"></stop>
          </radialGradient>

          <radialGradient id="solar-wash" gradientUnits="userSpaceOnUse"
            cx="250" cy="235" r="430">
            <stop offset="0" stop-color="#dff4ff" stop-opacity=".28"></stop>
            <stop offset=".38" stop-color="#8fd9ff" stop-opacity=".08"></stop>
            <stop offset=".74" stop-color="#07162e" stop-opacity=".1"></stop>
            <stop offset="1" stop-color="#01040d" stop-opacity=".62"></stop>
          </radialGradient>

          <radialGradient id="night-paint" cx="72%" cy="68%" r="86%">
            <stop offset="0" stop-color="#00030a" stop-opacity=".94"></stop>
            <stop offset=".62" stop-color="#010817" stop-opacity=".88"></stop>
            <stop offset="1" stop-color="#061629" stop-opacity=".7"></stop>
          </radialGradient>

          <filter id="land-relief" x="-12%" y="-12%" width="124%" height="124%"
            color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency=".012 .044" numOctaves="4"
              seed="19" result="terrain"></feTurbulence>
            <feDiffuseLighting in="terrain" surfaceScale="2.4" diffuseConstant=".84"
              lighting-color="#e8f0d6" result="terrain-light">
              <feDistantLight azimuth="224" elevation="48"></feDistantLight>
            </feDiffuseLighting>
            <feComposite in="terrain-light" in2="SourceGraphic" operator="in"
              result="lit-terrain"></feComposite>
            <feBlend in="SourceGraphic" in2="lit-terrain" mode="soft-light"></feBlend>
          </filter>

          <filter id="night-feather" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur stdDeviation="13"></feGaussianBlur>
          </filter>

          <filter id="route-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="route-haze"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="route-haze"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>

          <mask id="night-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
            x="0" y="0" width="720" height="720">
            <rect width="720" height="720" fill="black"></rect>
            <path id="night-mask-shape" fill="white" filter="url(#night-feather)"></path>
          </mask>
        </defs>

        <circle class="atmosphere" cx="360" cy="360" r="332"></circle>
        <circle class="ocean" cx="360" cy="360" r="282"></circle>
        <g id="graticule-layer" clip-path="url(#globe-clip)"></g>
        <g id="land-layer" clip-path="url(#globe-clip)" filter="url(#land-relief)"></g>
        <g id="border-layer" clip-path="url(#globe-clip)"></g>
        <circle class="solar-wash" cx="360" cy="360" r="282"
          clip-path="url(#globe-clip)"></circle>
        <circle class="night-surface" cx="360" cy="360" r="282"
          clip-path="url(#globe-clip)" mask="url(#night-mask)"></circle>
        <g id="route-layer" clip-path="url(#globe-clip)" filter="url(#route-glow)"></g>
        <g id="marker-layer" clip-path="url(#globe-clip)"></g>
      </svg>

      <div class="globe-action" id="globe-action">
        <span class="action-copy">拖动 · 点击添加目的地</span>
        <button class="time-toggle" id="time-toggle" type="button"
          aria-label="调整观察时刻（UTC）" aria-expanded="false" aria-controls="time-editor">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
        </button>
        <label class="time-editor" id="time-editor" hidden>
          <span>UTC</span>
          <input id="observation-time" type="datetime-local" step="60"
            aria-label="观察时刻，UTC">
        </label>
      </div>
      <p class="sr-only" id="globe-status" aria-live="polite"></p>
    </section>

    <section class="metrics" aria-label="行程结论">
      <p class="metric" id="total-distance">
        <span class="metric-value">0</span><span class="metric-unit">m</span>
        <span class="metric-label">行程总长</span>
      </p>
      <p class="metric" id="destination-count">
        <span class="metric-value">0</span><span class="metric-unit">个</span>
        <span class="metric-label">目的地</span>
      </p>
    </section>
  </main>

  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
