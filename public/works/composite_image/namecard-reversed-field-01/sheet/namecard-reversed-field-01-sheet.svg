<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2316 709" width="2316" height="709" role="img" aria-label="澜屿资本名片拼版 · 满版反白正反两面"><title>澜屿资本名片拼版 · 满版反白正反两面</title><desc>正反两面并排的拼版张:左为正面、右为反面。中性灰垫底,好让两张卡的裁切边界看得见;两面之间留 48px 装订间隙并置一枚套准标记,裁切时一并去除。单面尺寸与两份单面文件逐字相同。</desc><metadata>OceanLeo 第一方原创名片版面 [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-neutral{fill:#8C959F}.s-vec-neutral{stroke:#8C959F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-white{fill:#FFFFFF}.s-vec-white{stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g role="img"><title>拼版张的版底与装订间隙</title><rect id="sheetground" class="p-vec-neutral" x="0" y="0" width="2316" height="709" rx="0" ry="0"/></g><g role="img"><title>装订间隙中的套准标记，裁切时去除</title><circle id="regmark" class="p-vec-ink" cx="1158" cy="354.5" r="12"/></g><svg x="0" y="0" width="1134" height="709" viewBox="0 0 1134 709" data-source-ref="facefront"><title>澜屿资本名片正面 · 满版反白</title><desc>96×60mm 含 3mm 出血的名片正面。深墨色通铺满版、无任何分区，全部信息压在左下区排成一段连续文字，姓名一级、其余同级，一条强调发丝线是版面上唯一的非文字构件。</desc><metadata>OceanLeo 第一方原创名片版面 [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-white{fill:#FFFFFF}.s-vec-white{stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-accent{fill:#1F6FEB}.s-vec-accent{stroke:#1F6FEB;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g role="img"><title>深墨色满版底，铺到三毫米出血边缘</title><rect id="field" class="p-vec-ink" x="0" y="0" width="1134" height="709" rx="0" ry="0"/></g><g role="img"><title>沈砚青 SHEN YANQING</title><text id="name" class="p-vec-white" x="94" y="346" font-size="67.68" font-family="sans-serif">沈砚青 SHEN YANQING</text></g><g role="img"><title>强调色发丝线，宽度为版面四分之一以内</title><rect id="hairline" class="p-vec-accent" x=