<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 840" width="840" height="840" role="img" aria-label="叁两茶事 · 方印格徽记标志"><title>叁两茶事 · 方印格徽记标志</title><desc>一枚正方印：边栏围出印床，印床四等分，一格一字，对角两格阳文（实心底、字反白）、另外对角两格阴文（空底、字为印色）。四字按印文读法排——右上起，先上后下，再转左列。印面右下缺一角。罗马商号在印面之外，属说明不属印。</desc><metadata>OceanLeo 第一方原创标志设计（方印格） [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-surface{fill:#F5F7FA}.s-vec-surface{stroke:#F5F7FA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-accent-2{fill:#C47323}.s-vec-accent-2{stroke:#C47323;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g role="img"><title>偏暖的浅色底，阳文格里的字取的就是这一个色</title><rect id="ground" class="p-vec-surface" x="0" y="0" width="840" height="840" rx="0" ry="0"/></g><g role="img"><title>印面上边栏</title><rect id="rail-top" class="p-vec-accent-2" x="120" y="96" width="600" height="18" rx="1.499" ry="1.499"/></g><g role="img"><title>印面下边栏</title><rect id="rail-bottom" class="p-vec-accent-2" x="120" y="678" width="600" height="18" rx="1.499" ry="1.499"/></g><g role="img"><title>印面左边栏</title><rect id="rail-left" class="p-vec-accent-2" x="120" y="96" width="18" height="600" rx="1.499" ry="1.499"/></g><g role="img"><title>印面右边栏</title><rect id="rail-right" class="p-vec-accent-2" x="702" y="96" width="18" height="600" rx="1.499" ry="1.499"/></g><g role="img"><title>左上阳文格：实心印色底</title><rect id="cell-solid-tl" class="p-vec-accent-2" x="150" y="126" width="264" height="264" rx="21.991" ry="21.991"/></g><g role="img"><title>右下阳文格：实心印色底</title><rect id="cell-solid-br" class="p-vec-accent-2" x="426" y="402" width="264" height="264" rx="21.991" ry="21.991"/></g><g role="img"><title>印面右下缺角，让方形读成一枚印而不是一个方框</title><rect id="corner-notch" class="p-vec-surface" x="690" y="666" width="60" height="60" rx="4.998" ry="4.998"/></g><g aria-hidden="true"><text id="glyph-tl" class="p-vec-surface" x="198" y="342" font-size="168.48" font-family="sans-serif">茶</text></g><g aria-hidden="true"><text id="glyph-tr" class="p-vec-accent-2" x="474" y="342" font-size="168.48" font-family="sans-serif">叁</text></g><g aria-hidden="true"><text id="glyph-bl" class="p-vec-accent-2" x="198" y="618" font-size="168.48" font-family="sans-serif">事</text></g><g aria-hidden="true"><text id="glyph-br" class="p-vec-surface" x="474" y="618" font-size="168.48" font-family="sans-serif">两</text></g><g role="img"><title>SANLIANG TEA HOUSE EST. 2019</title><text id="roman" class="p-vec-ink" x="243" y="768" font-size="23.04" font-family="sans-serif">SANLIANG TEA HOUSE EST. 2019</text></g></svg>