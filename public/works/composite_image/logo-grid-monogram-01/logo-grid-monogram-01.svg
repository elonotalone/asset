<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="泓远港运 · 模数切分字组标志"><title>泓远港运 · 模数切分字组标志</title><desc>缩写字母组 HY 由一块实心方场被正交模数网格切分而成：字母不是画上去的笔画，是切掉沟槽之后剩下来的模块。横向锁定，方场在左，中文商号与罗马副名在右侧共用一条左基准线。</desc><metadata>OceanLeo 第一方原创标志设计（模数切分字组） [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-white{fill:#FFFFFF}.s-vec-white{stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-neutral{fill:#8C959F}.s-vec-neutral{stroke:#8C959F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g role="img"><title>深色底场，字组与文字从这块底场里透出来</title><rect id="ground" class="p-vec-ink" x="0" y="0" width="1120" height="560" rx="0" ry="0"/></g><g role="img"><title>被切分的实心方场，七列六行模数</title><rect id="field" class="p-vec-white" x="84" y="112" width="392" height="336" rx="27.989" ry="27.989"/></g><g role="img"><title>字母 H 中列上段沟槽</title><rect id="cut-h-upper" class="p-vec-ink" x="140" y="100" width="56" height="124" rx="4.665" ry="4.665"/></g><g role="img"><title>字母 H 中列下段沟槽</title><rect id="cut-h-lower" class="p-vec-ink" x="140" y="280" width="56" height="180" rx="4.665" ry="4.665"/></g><g role="img"><title>两个字母之间的整列分隔沟槽</title><rect id="cut-between" class="p-vec-ink" x="252" y="100" width="56" height="360" rx="4.665" ry="4.665"/></g><g role="img"><title>字母 Y 两臂之间的上段沟槽</title><rect id="cut-y-upper" class="p-vec-ink" x="364" y="100" width="56" height="124" rx="4.665" ry="4.665"/></g><g role="img"><title>字母 Y 左臂下方的沟槽</title><rect id="cut-y-left" class="p-vec-ink" x="300" y="280" width="64" height="180" rx="5.331" ry="5.331"/></g><g role="img"><title>字母 Y 右臂下方的沟槽</title><rect id="cut-y-right" class="p-vec-ink" x="420" y="280" width="68" height="180" rx="5.664" ry="5.664"/></g><g role="img"><title>方场与文字之间的竖向锁定沟槽</title><line id="lockup-gutter" class="s-vec-neutral" fill="none" x1="532" y1="420" x2="534" y2="140"/></g><g role="img"><title>泓远港运</title><text id="wordmark" class="p-vec-white" x="588" y="274" font-size="63.36" font-family="sans-serif">泓远港运</text></g><g role="img"><title>HONGYUAN PORT LOGISTICS</title><text id="descriptor" class="p-vec-neutral" x="588" y="350" font-size="23.04" font-family="sans-serif">HONGYUAN PORT LOGISTICS</text></g></svg>