<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-label="屿汐鲜运 · 负形反切标志"><title>屿汐鲜运 · 负形反切标志</title><desc>唯一的正形是一枚实心圆盘，标志是底色从圆盘上反切之后剩下来的那一弯。三道反切件全部使用底色本身，所以单色版与彩色版逐形相同。偏心竖向锁定：圆盘偏左上，中文商号在右侧竖排成一列，罗马副名贴在左下与圆盘左缘对齐。</desc><metadata>OceanLeo 第一方原创标志设计（负形反切） [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-white{fill:#FFFFFF}.s-vec-white{stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-accent{fill:#1F6FEB}.s-vec-accent{stroke:#1F6FEB;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g role="img"><title>纸白底场，反切件用的就是这一个色</title><rect id="ground" class="p-vec-white" x="0" y="0" width="800" height="940" rx="0" ry="0"/></g><g role="img"><title>唯一的正形：一枚实心圆盘</title><circle id="disc" class="p-vec-accent" cx="330" cy="400" r="250"/></g><g role="img"><title>第一道反切：错位的底色圆，把圆盘切成一弯</title><circle id="cut-crescent" class="p-vec-white" cx="222" cy="300" r="220"/></g><g role="img"><title>第二道反切：横向窄椭圆，把一弯切成上下两段</title><ellipse id="cut-band" class="p-vec-white" cx="449" cy="510" rx="145" ry="19"/></g><g role="img"><title>负形里唯一的实心占位件，它让空场读成空而不是缺</title><circle id="counter-dot" class="p-vec-accent" cx="228" cy="282" r="58"/></g><g aria-hidden="true"><text id="name-1" class="p-vec-ink" x="636" y="280" font-size="72" font-family="sans-serif">屿</text></g><g aria-hidden="true"><text id="name-2" class="p-vec-ink" x="636" y="384" font-size="72" font-family="sans-serif">汐</text></g><g aria-hidden="true"><text id="name-3" class="p-vec-ink" x="636" y="488" font-size="72" font-family="sans-serif">鲜</text></g><g aria-hidden="true"><text id="name-4" class="p-vec-ink" x="636" y="592" font-size="72" font-family="sans-serif">运</text></g><g role="img"><title>YUXI MARINE FRESH</title><text id="descriptor" class="p-vec-accent" x="80" y="792" font-size="23.04" font-family="sans-serif">YUXI MARINE FRESH</text></g></svg>