<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 560" width="1176" height="560" role="img" aria-label="岚埠仓储 · 模数切分字组标志"><title>岚埠仓储 · 模数切分字组标志</title><desc>缩写字母组 LB 由一块实心方场被 7 列 6 行的正交模数网格切分而成:L 是切掉右上两列之后剩下的角,B 是在实心块里挖掉一小一大两个内腔。四道沟槽全部使用底场那一个色,所以单色版与彩色版逐形相同。横向锁定:方场在左,中文商号与罗马副名在右侧共用一条左基准线,两者之间空一整个模数,间隙里不画任何东西。</desc><metadata>OceanLeo 第一方原创标志设计(模数切分字组) [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-white{fill:#FFFFFF}.s-vec-white{stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-neutral{fill:#8C959F}.s-vec-neutral{stroke:#8C959F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g role="img"><title>深色底场,字组与文字都是从这块底场里透出来的浅色</title><rect id="ground" class="p-vec-ink" x="0" y="0" width="1176" height="560" rx="0" ry="0"/></g><g role="img"><title>被切分的实心方场,七列六行模数,左上留两个模数的空场</title><rect id="field" class="p-vec-white" x="112" y="112" width="392" height="336" rx="27.989" ry="27.989"/></g><g role="img"><title>字母 L 的沟槽:切掉右侧两列的上五行,剩下的竖干与底横就是 L</title><rect id="cut-l-counter" class="p-vec-ink" x="168" y="100" width="112" height="292" rx="9.33" ry="9.33"/></g><g role="img"><title>两个字母之间的整列分隔沟槽,上下都越过方场边界收口</title><rect id="cut-between" class="p-vec-ink" x="280" y="100" width="56" height="360" rx="4.665" ry="4.665"/></g><g role="img"><title>字母 B 的上内腔沟槽,一个模数见方</title><rect id="cut-b-upper" class="p-vec-ink" x="392" y="168" width="56" height="56" rx="4.665" ry="4.665"/></g><g role="img"><title>字母 B 的下内腔沟槽,一个模数宽两个模数高,比上腔大一档</title><rect id="cut-b-lower" class="p-vec-ink" x="392" y="280" width="56" height="112" rx="4.665" ry="4.665"/></g><g role="img"><title>岚埠仓储</title><text id="wordmark" class="p-vec-white" x="560" y="284" font-size="63.36" font-family="sans-serif">岚埠仓储</text></g><g role="img"><title>LANBU BONDED STORAGE</title><text id="descriptor" class="p-vec-neutral" x="560" y="332" font-size="23.04" font-family="sans-serif">LANBU BONDED STORAGE</text></g></svg>