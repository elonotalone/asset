<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="深海观测联盟徽记 · 同心环带"><title>深海观测联盟徽记 · 同心环带</title><desc>深底浅图的同心徽记：六层环带按宽窄交替排布，中心为四瓣径向符号，一段成员名称落在中层浅带上。</desc><metadata>OceanLeo 第一方原创徽记 [CC0] | OceanLeo 程序化生成 [OCEANLEO-AIGEN]</metadata><style>.p-vec-ink{fill:#1F2328}.s-vec-ink{stroke:#1F2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-white{fill:#FFFFFF}.s-vec-white{stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-surface{fill:#F5F7FA}.s-vec-surface{stroke:#F5F7FA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-vec-accent{fill:#1F6FEB}.s-vec-accent{stroke:#1F6FEB;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><g aria-hidden="true"><rect id="ground" class="p-vec-ink" x="0" y="0" width="640" height="640" rx="0" ry="0"/></g><g role="img"><title>第一层：外框环带的外缘</title><circle id="band-rim" class="p-vec-white" cx="320" cy="320" r="300"/></g><g role="img"><title>第一层环带的内缘，留出一道窄边</title><circle id="band-rim-void" class="p-vec-ink" cx="320" cy="320" r="272"/></g><g role="img"><title>第二层：承载名称的宽环带</title><circle id="band-name" class="p-vec-surface" cx="320" cy="320" r="246"/></g><g role="img"><title>名称环带的内缘</title><circle id="band-name-void" class="p-vec-ink" cx="320" cy="320" r="196"/></g><g role="img"><title>第三层：内环带</title><circle id="band-inner" class="p-vec-white" cx="320" cy="320" r="150"/></g><g role="img"><title>内环带的内缘，为中心符号让出空场</title><circle id="band-inner-void" class="p-vec-ink" cx="320" cy="320" r="118"/></g><g role="img"><title>中心符号：朝上的一瓣</title><ellipse id="petal-n" class="p-vec-accent" cx="320" cy="258" rx="22" ry="48"/></g><g role="img"><title>中心符号：朝下的一瓣</title><ellipse id="petal-s" class="p-vec-accent" cx="320" cy="382" rx="22" ry="48"/></g><g role="img"><title>中心符号：朝左的一瓣</title><ellipse id="petal-w" class="p-vec-accent" cx="258" cy="320" rx="48" ry="22"/></g><g role="img"><title>中心符号：朝右的一瓣</title><ellipse id="petal-e" class="p-vec-accent" cx="382" cy="320" rx="48" ry="22"/></g><g role="img"><title>中心符号的轴心</title><circle id="hub" class="p-vec-white" cx="320" cy="320" r="34"/></g><g role="img"><title>深海观测联盟</title><text id="member-name" class="p-vec-ink" x="225" y="556" font-size="30.24" font-family="sans-serif">深海观测联盟</text></g></svg>