<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="一款先规划后执行的路径小游戏：画出经过三个取件点并回到交货口的路线，油量是唯一的难度。">
<title>夜班配送</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #101A2B; overflow: hidden; }
body { touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { display: block; width: 100%; height: 100%; }
#fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #fff; opacity: .75; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="一款先规划后执行的路径小游戏：画出经过三个取件点并回到交货口的路线，油量是唯一的难度。"></canvas>
<noscript><div id="fallback">这是一款需要 JavaScript 才能运行的小游戏：一款先规划后执行的路径小游戏：画出经过三个取件点并回到交货口的路线，油量是唯一的难度。</div></noscript>
<script>
// 夜班配送 —— 玩法风格「一次成行」（one-shot-route）
// 循环：看清地形与油量 → 在盘面上画出整条路线 → 按下出发 → 看着它一步一步走完并当场结算 →
//      拿这次的结果重画一条更省的路，回到看地形。
// 难度只来自一个能数出来的预算（油）。执行段一个输入都不收，随机零处，
// 地形与最短步数全部印在屏上——唯一稀缺的东西是油。
var bundle = (function () {
  "use strict";

  // '#' 墙 · '.' 可走 · 'S' 车库（起点）· 'A''B''C' 三个取件点 · 'X' 交货口
  var MAP = [
    "###########",
    "#S..#...A.#",
    "#.#.#.###.#",
    "#.#...#.B.#",
    "#.###.#.#.#",
    "#C....#..X#",
    "###########"
  ];
  var COLS = MAP[0].length, ROWS = MAP.length;
  var FUEL = 60;          // 一夜的油，按格算。跑掉的就没了，跑得再漂亮也不退。
  var STEP_FRAMES = 7;    // 执行段每格停几帧：慢到看得清每一步落在哪
  var SETTLE_MS = 1100;

  // 夜色 + 建筑灰蓝 + 一支只属于「我画的路线」的荧光绿 + 一支只属于「还没取的件」的琥珀
  var NIGHT = [16, 26, 43], WALL = [43, 58, 85], ROUTE = [87, 242, 165], PICK = [255, 179, 71];
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  var W = 0, H = 0, S = null, GRID = null, START = 0, EXIT = 0, PICKS = null, BEST = 0;

  function finite(v, f) { return (typeof v === "number" && isFinite(v)) ? v : f; }
  var idx = function (c, r) { return r * COLS + c; };
  var cx = function (i) { return i % COLS; };
  var cy = function (i) { return Math.floor(i / COLS); };

  function bake() {
    var r, c, ch;
    GRID = [];
    PICKS = [];
    for (r = 0; r < ROWS; r++) {
      for (c = 0; c < COLS; c++) {
        ch = MAP[r].charAt(c);
        GRID.push(ch === "#" ? 0 : 1);
        if (ch === "S") START = idx(c, r);
        else if (ch === "X") EXIT = idx(c, r);
        else if (ch === "A" || ch === "B" || ch === "C") PICKS.push(idx(c, r));
      }
    }
    BEST = bestRoute();
  }

  /** 从一个格子出发的逐格步数（广度优先，只走可走格）。 */
  function dist(from) {
    var d = [], i;
    for (i = 0; i < ROWS * COLS; i++) d.push(-1);
    d[from] = 0;
    var q = [from], head = 0;
    while (head < q.length) {
      var cur = q[head++];
      var x = cx(cur), y = cy(cur);
      var nb = [];
      if (x > 0) nb.push(idx(x - 1, y));
      if (x < COLS - 1) nb.push(idx(x + 1, y));
      if (y > 0) nb.push(idx(x, y - 1));
      if (y < ROWS - 1) nb.push(idx(x, y + 1));
      for (i = 0; i < nb.length; i++) {
        if (GRID[nb[i]] && d[nb[i]] < 0) { d[nb[i]] = d[cur] + 1; q.push(nb[i]); }
      }
    }
    return d;
  }

  /** 三个取件点的全部先后次序里最省的那条：这个数印在屏上，玩家看得见。 */
  function bestRoute() {
    var order = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
    var dS = dist(START), dP = [dist(PICKS[0]), dist(PICKS[1]), dist(PICKS[2])];
    var best = -1, k, o, n;
    for (k = 0; k < order.length; k++) {
      o = order[k];
      n = dS[PICKS[o[0]]] + dP[o[0]][PICKS[o[1]]] + dP[o[1]][PICKS[o[2]]] + dP[o[2]][EXIT];
      if (best < 0 || n < best) best = n;
    }
    return best;
  }

  function fresh(fuel, trip) {
    S = {
      phase: "plan",              // plan 规划 / run 执行 / settle 结算
      route: [START], fuel: finite(fuel, FUEL), trip: finite(trip, 1),
      at: 0, tick: 0, got: [false, false, false],
      settle: 0, why: "", lastRun: null, over: null, overAge: 0, acts: 0
    };
    return S;
  }

  function layout() {
    var bar = Math.max(52, Math.min(H * 0.12, 84));
    var foot = Math.max(44, Math.min(H * 0.10, 68));
    var pad = Math.max(12, Math.min(W, H) * 0.024);
    var side = Math.min(W * 0.26, 240);
    var freeW = W - side - pad * 3;
    var freeH = H - bar - foot - pad * 2;
    var tile = Math.floor(Math.min(freeW / COLS, freeH / ROWS));
    return {
      bar: bar, foot: foot, pad: pad, tile: tile, side: side,
      ox: pad + Math.max(0, (freeW - tile * COLS) / 2),
      oy: bar + pad + Math.max(0, (freeH - tile * ROWS) / 2),
      sideX: W - side - pad, footTop: H - foot
    };
  }

  function tileAt(x, y) {
    var L = layout();
    var c = Math.floor((x - L.ox) / L.tile), r = Math.floor((y - L.oy) / L.tile);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return -1;
    return idx(c, r);
  }

  function adjacent(a, b) {
    return Math.abs(cx(a) - cx(b)) + Math.abs(cy(a) - cy(b)) === 1;
  }

  function extend(i) {
    if (i < 0 || !GRID[i]) return;
    var head = S.route[S.route.length - 1];
    if (!adjacent(head, i)) return;
    if (S.route.length - 1 >= S.fuel) return;      // 画不出油量以外的路线
    S.route.push(i);
    S.acts++;
  }

  function undo() {
    if (S.route.length > 1) { S.route.pop(); S.acts++; }
  }

  function launch() {
    if (S.route.length < 2) return;
    S.phase = "run";
    S.at = 0; S.tick = 0;
    S.got = [false, false, false];
    S.acts++;
  }

  function finishRun() {
    var steps = S.route.length - 1;
    var all = S.got[0] && S.got[1] && S.got[2];
    var here = S.route[S.route.length - 1];
    S.fuel -= steps;
    S.lastRun = { steps: steps, got: (S.got[0] ? 1 : 0) + (S.got[1] ? 1 : 0) + (S.got[2] ? 1 : 0), atExit: here === EXIT };
    if (all && here === EXIT) {
      S.over = "win"; S.overAge = 0; S.why = "三件全送到，回到了交货口";
      S.phase = "settle"; S.settle = 0;
      return;
    }
    S.why = !all
      ? "还差 " + (3 - S.lastRun.got) + " 件没取"
      : "件取齐了，但没停在交货口";
    S.phase = "settle";
    S.settle = 0;
  }

  function afterSettle() {
    if (S.over) return;
    if (S.fuel < BEST) { S.over = "lose"; S.overAge = 0; S.why = "油不够跑完最短的那条路了"; return; }
    S.trip++;
    S.route = [START];
    S.phase = "plan";
  }

  function pixel(g, px, weight) {
    g.font = (weight ? weight + " " : "") + Math.round(px) +
      "px 'Noto Sans CJK SC', ui-monospace, 'PingFang SC', monospace";
  }

  return {
    title: "夜班配送",

    setup: function (env) {
      W = finite(env && env.width, 900);
      H = finite(env && env.height, 620);
      bake();
      fresh(FUEL, 1);
    },

    resize: function (w, h) { W = finite(w, W); H = finite(h, H); },

    pointer: function (x, y, phase) {
      if (phase !== "down") return;
      if (S.over) { if (S.overAge > 420) fresh(FUEL, 1); return; }
      if (S.phase !== "plan") return;             // 执行段不收任何输入
      extend(tileAt(finite(x, -1), finite(y, -1)));
    },

    key: function (code, phase) {
      if (phase !== "down") return;
      if (S.over) {
        if (code === "Space" || code === "Enter" || code === " ") fresh(FUEL, 1);
        return;
      }
      if (S.phase !== "plan") return;
      if (code === "Enter" || code === "Space" || code === " ") { launch(); return; }
      if (code === "KeyZ" || code === "Backspace") { undo(); return; }
      var head = S.route[S.route.length - 1];
      var x = cx(head), y = cy(head);
      if (code === "ArrowLeft") extend(idx(Math.max(0, x - 1), y));
      else if (code === "ArrowRight") extend(idx(Math.min(COLS - 1, x + 1), y));
      else if (code === "ArrowUp") extend(idx(x, Math.max(0, y - 1)));
      else if (code === "ArrowDown") extend(idx(x, Math.min(ROWS - 1, y + 1)));
    },

    update: function (dt) {
      dt = finite(dt, 16.67);
      if (S.over) { S.overAge += dt; if (S.phase === "settle") S.settle += dt; return; }
      if (S.phase === "run") {
        S.tick++;
        if (S.tick >= STEP_FRAMES) {
          S.tick = 0;
          S.at++;
          var here = S.route[S.at];
          for (var k = 0; k < PICKS.length; k++) if (here === PICKS[k]) S.got[k] = true;
          if (S.at >= S.route.length - 1) finishRun();
        }
        return;
      }
      if (S.phase === "settle") {
        S.settle += dt;
        if (S.settle >= SETTLE_MS) afterSettle();
      }
    },

    draw: function (g) {
      var L = layout(), i, k, x, y;

      g.fillStyle = rgba(NIGHT, 1);
      g.fillRect(0, 0, W, H);

      // 地形：墙是实块，可走格只留一个暗点，像素块不描边
      for (i = 0; i < ROWS * COLS; i++) {
        x = L.ox + cx(i) * L.tile;
        y = L.oy + cy(i) * L.tile;
        if (!GRID[i]) {
          g.globalAlpha = 1;
          g.fillStyle = rgba(WALL, 1);
          g.fillRect(x, y, L.tile, L.tile);
        } else {
          g.globalAlpha = 0.35;
          g.fillStyle = rgba(WALL, 1);
          g.fillRect(x + L.tile * 0.46, y + L.tile * 0.46, Math.max(2, L.tile * 0.08), Math.max(2, L.tile * 0.08));
        }
      }
      g.globalAlpha = 1;

      // 已画的路线：一格一块，永不淡出（退回上一个岔口重想是主要动作）
      for (i = 1; i < S.route.length; i++) {
        x = L.ox + cx(S.route[i]) * L.tile;
        y = L.oy + cy(S.route[i]) * L.tile;
        g.globalAlpha = S.phase === "plan" ? 0.42 : 0.24;
        g.fillStyle = rgba(ROUTE, 1);
        g.fillRect(x + L.tile * 0.22, y + L.tile * 0.22, L.tile * 0.56, L.tile * 0.56);
      }
      g.globalAlpha = 1;

      // 起点与交货口
      x = L.ox + cx(START) * L.tile; y = L.oy + cy(START) * L.tile;
      g.globalAlpha = 0.85;
      g.strokeStyle = rgba(ROUTE, 1);
      g.lineWidth = Math.max(2, L.tile * 0.09);
      g.strokeRect(x + 3, y + 3, L.tile - 6, L.tile - 6);
      x = L.ox + cx(EXIT) * L.tile; y = L.oy + cy(EXIT) * L.tile;
      g.strokeStyle = rgba(PICK, 1);
      g.strokeRect(x + 3, y + 3, L.tile - 6, L.tile - 6);
      g.globalAlpha = 1;

      // 取件点：还没取的是琥珀实块，取到手之后换成路线色的小块 —— 屏上亮着几个就是进度
      for (k = 0; k < PICKS.length; k++) {
        x = L.ox + cx(PICKS[k]) * L.tile;
        y = L.oy + cy(PICKS[k]) * L.tile;
        var done = S.got[k];
        g.globalAlpha = done ? 0.55 : 0.95;
        g.fillStyle = rgba(done ? ROUTE : PICK, 1);
        var m = done ? L.tile * 0.34 : L.tile * 0.22;
        g.fillRect(x + m, y + m, L.tile - m * 2, L.tile - m * 2);
      }
      g.globalAlpha = 1;

      // 执行段：车子就是路线色的一块，只是它在动
      if (S.phase === "run" || S.phase === "settle") {
        var at = S.route[Math.min(S.at, S.route.length - 1)];
        x = L.ox + cx(at) * L.tile; y = L.oy + cy(at) * L.tile;
        g.fillStyle = rgba(ROUTE, 1);
        g.fillRect(x + L.tile * 0.12, y + L.tile * 0.12, L.tile * 0.76, L.tile * 0.76);
      }

      // 规划段的笔头：下一步可以落在哪，四邻高亮
      if (S.phase === "plan" && !S.over) {
        var head = S.route[S.route.length - 1];
        var hx = cx(head), hy = cy(head);
        var nb = [idx(hx - 1, hy), idx(hx + 1, hy), idx(hx, hy - 1), idx(hx, hy + 1)];
        for (i = 0; i < nb.length; i++) {
          if (nb[i] < 0 || nb[i] >= ROWS * COLS || !GRID[nb[i]]) continue;
          if (Math.abs(cx(nb[i]) - hx) + Math.abs(cy(nb[i]) - hy) !== 1) continue;
          x = L.ox + cx(nb[i]) * L.tile; y = L.oy + cy(nb[i]) * L.tile;
          g.globalAlpha = 0.30;
          g.strokeStyle = rgba(ROUTE, 1);
          g.lineWidth = Math.max(1.5, L.tile * 0.05);
          g.strokeRect(x + 4, y + 4, L.tile - 8, L.tile - 8);
        }
        g.globalAlpha = 0.9;
        x = L.ox + cx(head) * L.tile; y = L.oy + cy(head) * L.tile;
        g.fillStyle = rgba(ROUTE, 1);
        g.fillRect(x + L.tile * 0.3, y + L.tile * 0.3, L.tile * 0.4, L.tile * 0.4);
        g.globalAlpha = 1;
      }
      g.lineWidth = 1;
    },

    hud: function (g) {
      var L = layout(), i;

      // 顶栏
      g.globalAlpha = 0.5;
      g.fillStyle = rgba(WALL, 1);
      g.fillRect(0, 0, W, L.bar);
      g.globalAlpha = 1;
      g.textBaseline = "middle";
      g.textAlign = "left";
      pixel(g, Math.min(W, H) * 0.04, "700");
      g.fillStyle = rgba(ROUTE, 1);
      g.fillText("夜班配送", L.pad, L.bar / 2);
      pixel(g, Math.min(W, H) * 0.028);
      g.fillStyle = rgba(PICK, 1);
      g.globalAlpha = 0.9;
      g.fillText(S.phase === "run" ? "出发了 · 现在只能看"
        : (S.phase === "settle" ? "本趟结算" : "第 " + S.trip + " 趟 · 画路线"),
        L.pad + Math.min(W * 0.16, 170), L.bar / 2);
      g.globalAlpha = 1;

      // 右栏：预算（这一件唯一的难度旋钮，全部摊开给玩家看）
      var sx = L.sideX, sy = L.bar + L.pad * 1.4, lh = Math.min(W, H) * 0.042;
      pixel(g, Math.min(W, H) * 0.03, "700");
      g.fillStyle = rgba(PICK, 1);
      g.fillText("油量", sx, sy);

      var barW = L.side, barH = Math.max(10, Math.min(W, H) * 0.026);
      var full = Math.max(0, Math.min(1, S.fuel / FUEL));
      g.globalAlpha = 0.3;
      g.fillStyle = rgba(WALL, 1);
      g.fillRect(sx, sy + lh * 0.5, barW, barH);
      g.globalAlpha = 0.95;
      g.fillStyle = rgba(S.fuel < BEST ? PICK : ROUTE, 1);
      g.fillRect(sx, sy + lh * 0.5, barW * full, barH);
      g.globalAlpha = 1;

      pixel(g, Math.min(W, H) * 0.027);
      g.fillStyle = rgba(ROUTE, 1);
      var rows = [
        "还剩 " + S.fuel + " 格油",
        "这一趟最少 " + BEST + " 步",
        "已画 " + (S.route.length - 1) + " 步",
        "已取 " + ((S.got[0] ? 1 : 0) + (S.got[1] ? 1 : 0) + (S.got[2] ? 1 : 0)) + " / 3 件"
      ];
      for (i = 0; i < rows.length; i++) {
        g.globalAlpha = i === 1 ? 0.7 : 0.95;
        g.fillText(rows[i], sx, sy + lh * (2 + i));
      }
      g.globalAlpha = 1;

      if (S.lastRun) {
        pixel(g, Math.min(W, H) * 0.025);
        g.fillStyle = rgba(PICK, 1);
        g.globalAlpha = 0.85;
        g.fillText("上一趟：" + S.lastRun.steps + " 步 / 取 " + S.lastRun.got + " 件",
          sx, sy + lh * 6.4);
        g.fillText(S.why, sx, sy + lh * 7.4);
        g.globalAlpha = 1;
      }

      // 底部指令条
      g.globalAlpha = 0.45;
      g.fillStyle = rgba(WALL, 1);
      g.fillRect(0, L.footTop, W, L.foot);
      g.globalAlpha = 1;
      pixel(g, Math.min(W, H) * 0.026);
      g.textAlign = "left";
      g.fillStyle = rgba(ROUTE, 1);
      g.globalAlpha = 0.85;
      g.fillText("点相邻格画路线　Z 撤一步　回车出发（出发之后一个键都不收）",
        L.pad, L.footTop + L.foot / 2);
      g.globalAlpha = 1;

      if (S.over) {
        g.textAlign = "right";
        pixel(g, Math.min(W, H) * 0.03, "700");
        g.fillStyle = rgba(S.over === "win" ? ROUTE : PICK, 1);
        g.fillText((S.over === "win" ? "送完了　" : "今晚到此为止　") + S.why + "　按一下再来",
          W - L.pad, L.footTop + L.foot / 2);
      }
    },

    __probe: function () {
      var L = layout();
      return {
        over: S.over, phase: S.phase, fuel: S.fuel, best: BEST, trip: S.trip,
        routeLen: S.route.length - 1, head: S.route[S.route.length - 1],
        at: S.at, acts: S.acts,
        got: [S.got[0], S.got[1], S.got[2]],
        cols: COLS, rows: ROWS,
        grid: GRID.slice(), start: START, exit: EXIT, picks: PICKS.slice(),
        geom: { ox: L.ox, oy: L.oy, tile: L.tile }
      };
    }
  };
})();


(function () {
  "use strict";
  var cv = document.getElementById("stage");
  var g = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, started = false;

  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (started && bundle.resize) bundle.resize(W, H);
  }

  fit();
  bundle.setup({ ctx: g, canvas: cv, width: W, height: H });
  started = true;
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  function at(e) {
    var r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function on(name, phase) {
    cv.addEventListener(name, function (e) {
      var p = at(e);
      bundle.pointer(p[0], p[1], phase);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  }
  on("pointerdown", "down");
  on("pointermove", "move");
  on("pointerup", "up");
  cv.addEventListener("pointercancel", function () { bundle.pointer(-1, -1, "up"); });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    bundle.key(e.code || e.key, "down");
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { bundle.key(e.code || e.key, "up"); });

  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(ts - last, 50) : 16.67;
    last = ts;
    bundle.update(dt, ts);
    bundle.draw(g, ts);
    bundle.hud(g, ts);
    window.requestAnimationFrame(loop);
  }
  window.requestAnimationFrame(loop);
})();

</script>
</body>
</html>
