<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="一款只靠排除的推理小游戏：按行列线索推出哪些格是实心的，整盘不需要猜一格。">
<title>墨格</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #F6F1E6; overflow: hidden; }
body { touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { display: block; width: 100%; height: 100%; }
#fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #fff; opacity: .75; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="一款只靠排除的推理小游戏：按行列线索推出哪些格是实心的，整盘不需要猜一格。"></canvas>
<noscript><div id="fallback">这是一款需要 JavaScript 才能运行的小游戏：一款只靠排除的推理小游戏：按行列线索推出哪些格是实心的，整盘不需要猜一格。</div></noscript>
<script>
// 墨格 —— 玩法风格「纸上排除」（paper-deduction）
// 循环：读一条线索 → 找到它唯一能落的地方 → 落墨锁死 → 这一步让另一条线索变唯一，回到读线索。
// 难度只来自线索的交叉层数。没有计时器，没有随机，盘是设计出来的：
// 这一盘（八行八列，实心 31 格）已用纯逐行逐列排除自验通过，整局任何一步都不需要猜。
var bundle = (function () {
  "use strict";

  // 盘面写死。'#' 是实心。出盘时用 line-solve 自验过「不猜一格可解」。
  var PLAN = [
    "...##...",
    "...##...",
    ".######.",
    "...##...",
    "#..##..#",
    "#..##..#",
    "#######.",
    "..####.."
  ];
  var ROWS = PLAN.length, COLS = PLAN[0].length;
  var MISTAKES_MAX = 3;

  // 一张暖白纸 + 一支墨 + 一支朱砂 + 一支比墨浅的铅（玩家自己的排除记号）。
  var PAPER = [246, 241, 230], INK = [35, 32, 27], RED = [178, 58, 46], PENCIL = [167, 158, 140];
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  var W = 0, H = 0, S = null, SOL = null, ROWC = null, COLC = null;

  function finite(v, f) { return (typeof v === "number" && isFinite(v)) ? v : f; }

  function runsOf(line) {
    var out = [], n = 0, i;
    for (i = 0; i < line.length; i++) {
      if (line[i]) n++;
      else if (n) { out.push(n); n = 0; }
    }
    if (n) out.push(n);
    return out.length ? out : [0];
  }

  function bake() {
    var r, c;
    SOL = [];
    for (r = 0; r < ROWS; r++) {
      var row = [];
      for (c = 0; c < COLS; c++) row.push(PLAN[r].charAt(c) === "#" ? 1 : 0);
      SOL.push(row);
    }
    ROWC = [];
    for (r = 0; r < ROWS; r++) ROWC.push(runsOf(SOL[r]));
    COLC = [];
    for (c = 0; c < COLS; c++) {
      var col = [];
      for (r = 0; r < ROWS; r++) col.push(SOL[r][c]);
      COLC.push(runsOf(col));
    }
  }

  function total() {
    var n = 0, r, c;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) n += SOL[r][c];
    return n;
  }

  // 0 未定 · 1 已落墨 · 2 打了排除记号 · 3 落错（朱砂，不可撤）
  function fresh() {
    var cells = [], i;
    for (i = 0; i < ROWS * COLS; i++) cells.push(0);
    S = {
      cells: cells, mode: "ink", mistakes: 0, found: 0, need: total(),
      last: -1, lastKind: "", cursor: 0, over: null, overAge: 0, acts: 0
    };
    return S;
  }

  function layout() {
    var bar = Math.max(56, Math.min(H * 0.13, 92));
    var pad = Math.max(14, Math.min(W, H) * 0.028);
    var side = Math.min(W * 0.30, 268);              // 右栏：这一盘的规矩，常驻
    var freeW = W - side - pad * 3;
    var freeH = H - bar - pad * 2;
    // 线索槽按三格宽算：这一盘最长的线索是三段。
    var cell = Math.floor(Math.min(freeW / (COLS + 3), freeH / (ROWS + 3)));
    var gutter = cell * 3;
    var boardW = gutter + cell * COLS;
    var boardH = gutter + cell * ROWS;
    return {
      bar: bar, pad: pad, cell: cell, gutter: gutter, side: side,
      ox: pad + Math.max(0, (freeW - boardW) / 2),
      oy: bar + pad + Math.max(0, (freeH - boardH) / 2),
      sideX: W - side - pad, boardW: boardW, boardH: boardH
    };
  }

  function gridAt(x, y) {
    var L = layout();
    var c = Math.floor((x - L.ox - L.gutter) / L.cell);
    var r = Math.floor((y - L.oy - L.gutter) / L.cell);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return -1;
    return r * COLS + c;
  }

  function chipBox() {
    var L = layout();
    var h = Math.min(L.bar * 0.52, 34);
    return { x: L.pad + Math.min(W * 0.22, 210), y: (L.bar - h) / 2, w: Math.min(W * 0.20, 176), h: h };
  }

  function rowDone(r) {
    var c;
    for (c = 0; c < COLS; c++) if (SOL[r][c] && S.cells[r * COLS + c] !== 1) return false;
    return true;
  }
  function colDone(c) {
    var r;
    for (r = 0; r < ROWS; r++) if (SOL[r][c] && S.cells[r * COLS + c] !== 1) return false;
    return true;
  }

  function place(i) {
    if (S.over || i < 0) return;
    var st = S.cells[i];
    if (st === 1 || st === 3) return;               // 已定的格子不再动：盘面只往前收敛
    var r = Math.floor(i / COLS), c = i % COLS;
    if (S.mode === "mark") {
      S.cells[i] = st === 2 ? 0 : 2;                // 排除记号是草稿，随便改，不判对错
      S.last = i; S.lastKind = "mark"; S.acts++;
      return;
    }
    S.acts++;
    S.last = i;
    if (SOL[r][c]) {
      S.cells[i] = 1; S.lastKind = "ink"; S.found++;
      if (S.found >= S.need) { S.over = "win"; S.overAge = 0; }
    } else {
      S.cells[i] = 3; S.lastKind = "wrong"; S.mistakes++;
      if (S.mistakes >= MISTAKES_MAX) { S.over = "lose"; S.overAge = 0; }
    }
  }

  function serif(g, px, weight) {
    g.font = (weight ? weight + " " : "") + Math.round(px) +
      "px 'Noto Sans CJK SC', system-ui, -apple-system, 'PingFang SC', sans-serif";
  }

  return {
    title: "墨格",

    setup: function (env) {
      W = finite(env && env.width, 900);
      H = finite(env && env.height, 620);
      bake();
      fresh();
    },

    resize: function (w, h) { W = finite(w, W); H = finite(h, H); },

    pointer: function (x, y, phase) {
      if (phase !== "down") return;
      x = finite(x, -1); y = finite(y, -1);
      if (S.over) {
        if (S.overAge > 420) { fresh(); }
        return;
      }
      var b = chipBox();
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        S.mode = S.mode === "ink" ? "mark" : "ink";
        return;
      }
      var i = gridAt(x, y);
      if (i >= 0) { S.cursor = i; place(i); }
    },

    key: function (code, phase) {
      if (phase !== "down") return;
      if (S.over) {
        if (code === "Space" || code === "Enter" || code === " ") fresh();
        return;
      }
      var r = Math.floor(S.cursor / COLS), c = S.cursor % COLS;
      if (code === "ArrowLeft") { S.cursor = r * COLS + Math.max(0, c - 1); return; }
      if (code === "ArrowRight") { S.cursor = r * COLS + Math.min(COLS - 1, c + 1); return; }
      if (code === "ArrowUp") { S.cursor = Math.max(0, r - 1) * COLS + c; return; }
      if (code === "ArrowDown") { S.cursor = Math.min(ROWS - 1, r + 1) * COLS + c; return; }
      if (code === "Enter" || code === "KeyX") { place(S.cursor); return; }
      if (code === "Space" || code === "KeyM" || code === " ") S.mode = S.mode === "ink" ? "mark" : "ink";
    },

    // 手不动，盘面一格都不变。这里只推「结算画面停留了多久」这一个计时器。
    update: function (dt) {
      dt = finite(dt, 16.67);
      if (S.over) S.overAge += dt;
    },

    draw: function (g) {
      var L = layout(), r, c, i, x, y;

      g.fillStyle = rgba(PAPER, 1);
      g.fillRect(0, 0, W, H);

      // 线索槽底：比纸略深一点点，靠透明度做，不引第五个颜色
      g.globalAlpha = 0.05;
      g.fillStyle = rgba(INK, 1);
      g.fillRect(L.ox, L.oy, L.gutter, L.boardH);
      g.fillRect(L.ox + L.gutter, L.oy, L.boardW - L.gutter, L.gutter);
      g.globalAlpha = 1;

      // 格线：四格一道粗线，帮眼睛数格
      for (i = 0; i <= COLS; i++) {
        x = L.ox + L.gutter + i * L.cell;
        g.globalAlpha = i % 4 === 0 ? 0.55 : 0.20;
        g.lineWidth = i % 4 === 0 ? 2 : 1;
        g.strokeStyle = rgba(INK, 1);
        g.beginPath(); g.moveTo(x, L.oy); g.lineTo(x, L.oy + L.boardH); g.stroke();
      }
      for (i = 0; i <= ROWS; i++) {
        y = L.oy + L.gutter + i * L.cell;
        g.globalAlpha = i % 4 === 0 ? 0.55 : 0.20;
        g.lineWidth = i % 4 === 0 ? 2 : 1;
        g.strokeStyle = rgba(INK, 1);
        g.beginPath(); g.moveTo(L.ox, y); g.lineTo(L.ox + L.boardW, y); g.stroke();
      }
      g.globalAlpha = 1;
      g.lineWidth = 1;

      // 线索：整条线推完之后自己变淡 —— 这是这一件唯一的「做对了」反馈
      serif(g, L.cell * 0.44, "600");
      g.fillStyle = rgba(INK, 1);
      g.textBaseline = "middle";
      for (r = 0; r < ROWS; r++) {
        g.globalAlpha = rowDone(r) ? 0.28 : 0.92;
        g.textAlign = "right";
        var rt = ROWC[r].join(" ");
        g.fillText(rt, L.ox + L.gutter - L.cell * 0.28, L.oy + L.gutter + r * L.cell + L.cell / 2);
      }
      for (c = 0; c < COLS; c++) {
        g.globalAlpha = colDone(c) ? 0.28 : 0.92;
        g.textAlign = "center";
        var cl = COLC[c];
        for (i = 0; i < cl.length; i++) {
          g.fillText(String(cl[i]),
            L.ox + L.gutter + c * L.cell + L.cell / 2,
            L.oy + L.gutter - L.cell * (cl.length - i) + L.cell * 0.5);
        }
      }
      g.globalAlpha = 1;

      // 格子本身
      for (r = 0; r < ROWS; r++) {
        for (c = 0; c < COLS; c++) {
          i = r * COLS + c;
          x = L.ox + L.gutter + c * L.cell;
          y = L.oy + L.gutter + r * L.cell;
          var st = S.cells[i];
          if (st === 1) {
            g.globalAlpha = 0.94;
            g.fillStyle = rgba(INK, 1);
            g.fillRect(x + 1.5, y + 1.5, L.cell - 3, L.cell - 3);
          } else if (st === 2) {
            g.globalAlpha = 0.85;
            g.strokeStyle = rgba(PENCIL, 1);
            g.lineWidth = Math.max(1.5, L.cell * 0.06);
            g.beginPath();
            g.moveTo(x + L.cell * 0.34, y + L.cell * 0.34);
            g.lineTo(x + L.cell * 0.66, y + L.cell * 0.66);
            g.moveTo(x + L.cell * 0.66, y + L.cell * 0.34);
            g.lineTo(x + L.cell * 0.34, y + L.cell * 0.66);
            g.stroke();
          } else if (st === 3) {
            g.globalAlpha = 0.9;
            g.strokeStyle = rgba(RED, 1);
            g.lineWidth = Math.max(2, L.cell * 0.09);
            g.beginPath();
            g.moveTo(x + L.cell * 0.26, y + L.cell * 0.26);
            g.lineTo(x + L.cell * 0.74, y + L.cell * 0.74);
            g.moveTo(x + L.cell * 0.74, y + L.cell * 0.26);
            g.lineTo(x + L.cell * 0.26, y + L.cell * 0.74);
            g.stroke();
          }
          g.globalAlpha = 1;
        }
      }

      // 键盘光标：不用 hover，也能看见方向键下一次会落在哪一格。
      if (!S.over) {
        x = L.ox + L.gutter + (S.cursor % COLS) * L.cell;
        y = L.oy + L.gutter + Math.floor(S.cursor / COLS) * L.cell;
        g.globalAlpha = 0.78;
        g.strokeStyle = rgba(RED, 1);
        g.lineWidth = Math.max(2, L.cell * 0.07);
        g.strokeRect(x + 2.5, y + 2.5, L.cell - 5, L.cell - 5);
        g.globalAlpha = 1;
      }

      // 输了才揭答案：没找到的实心格用铅笔轮廓补出来，让人看见自己差在哪
      if (S.over === "lose") {
        g.globalAlpha = 0.5;
        g.strokeStyle = rgba(PENCIL, 1);
        g.lineWidth = Math.max(1.5, L.cell * 0.07);
        for (r = 0; r < ROWS; r++) {
          for (c = 0; c < COLS; c++) {
            if (SOL[r][c] && S.cells[r * COLS + c] !== 1) {
              g.strokeRect(L.ox + L.gutter + c * L.cell + 3, L.oy + L.gutter + r * L.cell + 3,
                L.cell - 6, L.cell - 6);
            }
          }
        }
        g.globalAlpha = 1;
      }
      g.lineWidth = 1;
    },

    hud: function (g) {
      var L = layout(), i;

      // 顶栏
      g.globalAlpha = 0.06;
      g.fillStyle = rgba(INK, 1);
      g.fillRect(0, 0, W, L.bar);
      g.globalAlpha = 0.45;
      g.strokeStyle = rgba(INK, 1);
      g.beginPath(); g.moveTo(0, L.bar); g.lineTo(W, L.bar); g.stroke();
      g.globalAlpha = 1;

      g.textBaseline = "middle";
      g.textAlign = "left";
      serif(g, Math.min(W, H) * 0.042, "700");
      g.fillStyle = rgba(INK, 1);
      g.fillText("墨格", L.pad, L.bar / 2);

      // 模式牌：落墨 / 打叉，点它或按空格换
      var b = chipBox();
      g.globalAlpha = S.mode === "ink" ? 0.9 : 0.55;
      g.strokeStyle = rgba(INK, 1);
      g.lineWidth = 1.5;
      g.strokeRect(b.x, b.y, b.w, b.h);
      g.globalAlpha = 1;
      serif(g, b.h * 0.5);
      g.textAlign = "center";
      g.fillStyle = rgba(S.mode === "ink" ? INK : PENCIL, 1);
      g.fillText(S.mode === "ink" ? "落墨（空格换）" : "打叉（空格换）", b.x + b.w / 2, b.y + b.h / 2);

      // 右上：还剩几格 + 错几次
      g.textAlign = "right";
      serif(g, Math.min(W, H) * 0.032);
      g.fillStyle = rgba(INK, 1);
      g.globalAlpha = 0.8;
      g.fillText("还剩 " + (S.need - S.found) + " 格", W - L.pad, L.bar * 0.34);
      g.globalAlpha = 1;
      var dots = "";
      for (i = 0; i < MISTAKES_MAX; i++) dots += i < S.mistakes ? "×" : "·";
      g.fillStyle = rgba(S.mistakes ? RED : INK, 1);
      g.globalAlpha = S.mistakes ? 0.95 : 0.55;
      g.fillText("错 " + dots, W - L.pad, L.bar * 0.72);
      g.globalAlpha = 1;

      // 右栏：这一盘的规矩，常驻不动
      var sx = L.sideX, sy = L.bar + L.pad * 1.6;
      var lh = Math.min(W, H) * 0.046;
      serif(g, Math.min(W, H) * 0.03, "700");
      g.textAlign = "left";
      g.fillStyle = rgba(INK, 1);
      g.fillText("怎么推", sx, sy);
      serif(g, Math.min(W, H) * 0.026);
      g.globalAlpha = 0.78;
      var lines = [
        "行列外的数字是那条线上",
        "连续实心格的长度，按顺序排。",
        "先找一眼能定死的长线索，",
        "定下来的格子再去卡别的线索。",
        "",
        "落墨：确定是实心的格。",
        "打叉：确定是空的格（草稿，",
        "随便改，不算错）。",
        "",
        "方向键移格，回车落下；",
        "也可以直接点任意格。",
        "落错三次这一局到此为止。",
        "没有计时器，想多久都行。"
      ];
      for (i = 0; i < lines.length; i++) g.fillText(lines[i], sx, sy + lh * (i + 1.15));
      g.globalAlpha = 1;

      // 结算：只用一行字，不弹窗、不盖住盘面
      if (S.over) {
        var msg = S.over === "win"
          ? "推完了　" + (MISTAKES_MAX - S.mistakes) + " 次容错没用完"
          : "错满三次　浅框是你没找到的实心格";
        g.globalAlpha = 0.1;
        g.fillStyle = rgba(INK, 1);
        g.fillRect(0, H - L.pad * 3.2, W, L.pad * 3.2);
        g.globalAlpha = 1;
        serif(g, Math.min(W, H) * 0.034, "600");
        g.textAlign = "center";
        g.fillStyle = rgba(S.over === "win" ? INK : RED, 1);
        g.fillText(msg + "　·　按一下再来", W / 2, H - L.pad * 1.6);
      }
    },

    __probe: function () {
      var L = layout();
      return {
        over: S.over, mode: S.mode, mistakes: S.mistakes, mistakesMax: MISTAKES_MAX,
        found: S.found, need: S.need, left: S.need - S.found, acts: S.acts,
        cursor: S.cursor,
        rows: ROWS, cols: COLS,
        cells: S.cells.slice(),          // 屏上看得见的东西：哪些格已定、哪些打了叉
        rowClues: ROWC, colClues: COLC,  // 屏上印着的线索
        geom: { ox: L.ox + L.gutter, oy: L.oy + L.gutter, cell: L.cell, chip: chipBox() }
      };
    }
  };
})();


(function () {
  "use strict";
  var cv = document.getElementById("stage");
  var g = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, started = false;

  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (started && bundle.resize) bundle.resize(W, H);
  }

  fit();
  bundle.setup({ ctx: g, canvas: cv, width: W, height: H });
  started = true;
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  function at(e) {
    var r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function on(name, phase) {
    cv.addEventListener(name, function (e) {
      var p = at(e);
      bundle.pointer(p[0], p[1], phase);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  }
  on("pointerdown", "down");
  on("pointermove", "move");
  on("pointerup", "up");
  cv.addEventListener("pointercancel", function () { bundle.pointer(-1, -1, "up"); });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    bundle.key(e.code || e.key, "down");
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { bundle.key(e.code || e.key, "up"); });

  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(ts - last, 50) : 16.67;
    last = ts;
    bundle.update(dt, ts);
    bundle.draw(g, ts);
    bundle.hud(g, ts);
    window.requestAnimationFrame(loop);
  }
  window.requestAnimationFrame(loop);
})();

</script>
</body>
</html>
